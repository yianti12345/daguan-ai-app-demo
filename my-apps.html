<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>我的应用</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23587FFF'/><text x='16' y='22' font-size='18' text-anchor='middle' fill='white' font-family='sans-serif'>达</text></svg>">
<link rel="stylesheet" href="assets/tokens.css?v=b38a25d3">
<link rel="stylesheet" href="assets/sys.css?v=1affd7da">
<link rel="stylesheet" href="assets/saas.css?v=de41a98c">
</head>
<body class="saas">

<div class="saas">
  <!-- 侧栏由 shell.js 填：data-nav="saas" 选客户侧那套导航。
       只有「我的应用」一项 —— 应用市场要购买链路、系统设置下五个页面都没做，
       没有落地页的入口不放（理由写在 shell.js 的 NAV_SAAS 注释里）。 -->
  <nav class="sider" data-nav="saas" data-active="my-apps" aria-label="主导航"></nav>

  <div class="saas-main">
    <header class="saas-bar">
      <div class="sb-l">
        <!-- 左上角返回：图形由 shell.js 填（与后台面包屑那颗同一份定义），
             这里只给空壳和去处 —— 不复制第二份 svg path。 -->
        <a class="crumb-back" id="sb-back" href="index.html" title="返回" aria-label="返回"></a>
        <span class="sb-ico" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <rect x="3" y="3" width="7.6" height="7.6" rx="1.6"/><rect x="13.4" y="3" width="7.6" height="7.6" rx="1.6"/>
            <rect x="3" y="13.4" width="7.6" height="7.6" rx="1.6"/><rect x="13.4" y="13.4" width="7.6" height="7.6" rx="1.6"/>
          </svg>
        </span>
        <span class="sr-only">我的应用</span>
        <span aria-hidden="true">我的应用</span>
      </div>
      <div class="sb-r">
        <div class="ab-wrap">
          <button type="button" class="ab-user" id="ab-user" aria-haspopup="true" aria-expanded="false" aria-controls="ab-menu" aria-label="当前账号 zheng，达观数据">
            <span class="ab-av" aria-hidden="true">郑</span>
            <span class="ab-nm"><b>zheng</b><i>达观数据</i></span>
            <svg class="ab-cv" aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <div class="ab-menu" id="ab-menu" role="menu" hidden>
            <button type="button" class="ab-mi" role="menuitem">
              <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h13l-3-3M20 16H7l3 3"/></svg>
              切换平台
            </button>
            <button type="button" class="ab-mi" role="menuitem">
              <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
              修改密码
            </button>
            <button type="button" class="ab-mi" role="menuitem">
              <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.6v.6"/></svg>
              关于系统
            </button>
            <button type="button" class="ab-mi is-out" role="menuitem">
              <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4"/><path d="M9 8l4 4-4 4M13 12H4"/></svg>
              退出登录
            </button>
          </div>
        </div>
      </div>
    </header>

    <!-- 与「应用市场」同一段 hero：标题 + 副标题 + 880×48 搜索 + 三行筛选，
         背景是那张 2480×604 的渐变图。真源的 MyApply 路由目前是 404，
         所以这一页没有逐像素对象 —— 度量全部取自同壳的 ApplyShop，不再自称 1:1。 -->
    <section class="saas-hero">
      <h1 class="sh-t">我的应用</h1>
      <p class="sh-s" id="sh-sub">已开通的应用都在这里，点开就能用</p>
      <div class="saas-search">
        <input id="kw" type="search" placeholder="应用名称" aria-label="按应用名称搜索">
        <button type="button" class="btn primary" id="act-search">搜索</button>
      </div>
      <div class="saas-filters" id="filters"></div>
    </section>
    <div class="saas-groups" id="groups"></div>
  </div>
</div>

<!-- ui-kit 的 toast 需要一个宿主；本页不主动弹，但共享件按契约找 #toast -->
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="assets/data.js?v=c21d73e3"></script>
<script src="assets/ui-kit.js?v=5e35a26b"></script>
<script src="assets/confirm.js?v=33f3cd5b"></script>
<script src="assets/shell.js?v=e279ad97"></script>
<script src="assets/saas.js?v=7e6ae97b"></script>
</body>
</html>
