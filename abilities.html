<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="assets/sys.css?v=1affd7da">

<style>
/* 只作用于本页。取值全部来自 tokens.css，不新增色值/字号/圆角。 */
.ab-bar{display:flex;align-items:center;gap:var(--space-8);flex-wrap:wrap;padding:0 0 var(--space-12)}
.ab-table{--gt-min-w:940px;overflow-x:auto}
/* 2026-11-05 用户：「已经有编辑操作了，再加个蓝色的字体可以点击…有什么意义」——名字只当文字。 */
.ab-name{color:var(--color-text-primary)}
.ab-desc{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--color-text-secondary)}
.ab-cnt{text-align:center;color:var(--color-text-secondary);font-variant-numeric:tabular-nums}
.ab-md{text-align:center}
.ab-at{color:var(--color-text-secondary);font-variant-numeric:tabular-nums;white-space:nowrap}
.ab-ops{display:flex;align-items:center;gap:var(--space-12);justify-content:flex-end}
.ab-op{height:24px;padding:0;border:0;background:none;font-family:inherit;font-size:var(--font-size-body);color:var(--color-brand-ink);cursor:pointer;white-space:nowrap}
.ab-op:hover{text-decoration:underline}
.ab-op.is-danger{color:var(--color-danger)}
.ab-pg{margin-left:auto;color:var(--color-text-tertiary)}
</style>
<link rel="stylesheet" href="assets/capability-workspace.css?v=734c92c1">
</head>
<body class="cap-workspace asset-management">
<div class="app">
  <nav class="sider" data-active="cap-abilities"></nav>
  <div class="workspace">
    <header class="hdr">
      <nav class="crumb">
        <b>资产中心</b>
        <span class="sep" aria-hidden="true"><svg aria-hidden="true" viewBox="0 0 14 14" fill="currentColor"><path d="M4.396 2.146a.5.5 0 0 0-.057.638l.057.07L8.543 7l-4.147 4.146a.5.5 0 0 0-.057.638l.057.07a.5.5 0 0 0 .638.057l.07-.057 4.5-4.5a.5.5 0 0 0 .057-.638l-.057-.07-4.5-4.5a.5.5 0 0 0-.708 0Z"/></svg></span>
        <b>能力管理</b>
      </nav>
    </header>

    <main class="main">
      <h1 class="sr-only">能力管理</h1>
      <!-- 2026-11-05：一条记录 = 一个能力（一个独立任务），不是一条接口。
           2026-11-09：导入/导出成对——顶部「导入」吃 OpenAPI、接口文本或一条导出的能力包；
           每行「导出」输出这条能力的 JSON，导回来能直接进池子。 -->
      <div class="bar">
        <button type="button" class="btn ghost" id="act-import">导入</button>
        <button type="button" class="btn ghost" id="act-export" disabled>批量导出</button>
        <button type="button" class="btn primary" id="act-new">新建能力</button>
        <span class="bar-sp"></span>
        <label class="field w240"><input id="kw" type="text" placeholder="搜索能力名称或说明" aria-label="搜索能力"></label>
      </div>

      <div class="ab-table gtable">
        <div class="gtable-head" id="head" aria-hidden="true"></div>
        <div class="gtable-body" id="list" role="list" aria-label="能力列表"></div>
        <div class="gtable-foot"><span id="total"></span><span class="ab-pg" id="pg"></span></div>
      </div>
    </main>
    <div id="toast" class="toast" data-on="false" role="status" aria-live="polite"></div>
  </div>
</div>

</body>
