<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>能力配置</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23587FFF'/%3E%3Crect x='8' y='9' width='16' height='3' rx='1.5' fill='white'/%3E%3Crect x='8' y='15' width='11' height='3' rx='1.5' fill='white' opacity='.75'/%3E%3Crect x='8' y='21' width='7' height='3' rx='1.5' fill='white' opacity='.5'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/tokens.css?v=828c7552">
<link rel="stylesheet" href="assets/sys.css?v=36927670">
<link rel="stylesheet" href="assets/xiaozhi.css?v=455c3b02">
<style>
/* 只作用于本页。取值全部来自 tokens.css，不新增色值/字号。 */
.page-hd{display:flex;align-items:flex-start;gap:var(--space-12);margin:0 0 var(--space-12)}
.page-hd h1{margin:0;font-size:var(--font-size-display);font-weight:600;line-height:var(--leading-display);color:var(--color-text-primary)}
.page-hd .ops{margin-left:auto;display:flex;align-items:center;gap:var(--space-8)}
.it-bar{display:flex;align-items:center;gap:var(--space-8);flex-wrap:wrap;padding:0 0 var(--space-12)}
/* 8 列在 1280 视口下放不进内容区：照真源允许表格横向滚动，不硬压列宽。 */
/* 8 列在窄屏放不下：只设最小宽变量，表格自己的规则留在共享层，页内不重写组件 */
.it-pager{display:inline-flex;align-items:center;gap:var(--space-4);margin-left:auto}
.it-pn{min-width:24px;height:24px;padding:0 6px;border:0;border-radius:var(--radius-sm);background:none;font-family:inherit;font-size:var(--font-size-caption);color:var(--color-text-secondary);cursor:pointer}
.it-pn:hover{background:var(--color-state-hover)}
.it-pn[aria-current="true"]{background:var(--color-brand-active);color:var(--color-text-inverse)}
.it-pg{color:var(--color-text-tertiary)}
.it-name{color:var(--color-text-primary)}
.it-desc{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--color-text-secondary)}
.it-at{color:var(--color-text-secondary);font-variant-numeric:tabular-nums}
.it-ops{display:flex;align-items:center;gap:var(--space-12);justify-content:flex-end}
.it-op{height:24px;padding:0;border:0;background:none;font-family:inherit;font-size:var(--font-size-body);color:var(--color-brand-ink);cursor:pointer;white-space:nowrap}
.it-op:hover{text-decoration:underline}
.it-op.is-danger{color:var(--color-danger)}
/* 新增/编辑：左（介绍 + 内容）、右（能力名称 + MD 文档内容）。宽弹窗 880，两栏各一半。 */
.it-two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--space-16);flex:1 1 auto;min-height:0;align-items:stretch}
.it-col{display:flex;flex-direction:column;gap:var(--space-8);min-height:0}
.it-lb{font-size:var(--font-size-caption);color:var(--color-text-secondary)}
.it-raw{flex:1 1 auto;min-height:180px;resize:vertical;border:1px solid var(--color-border-control);border-radius:var(--radius-control);padding:var(--space-12);font-family:inherit;font-size:var(--font-size-body);line-height:1.7;color:var(--color-text-primary);background:var(--surface-page)}
.it-raw:focus{outline:2px solid var(--color-brand);outline-offset:-1px;border-color:var(--color-brand)}
/* 介绍：2–3 行（约 72），固定高度不跟下面的内容框抢；想写更多仍可拉高。 */
.it-intro{flex:0 0 auto;min-height:72px;resize:vertical;border:1px solid var(--color-border-control);border-radius:var(--radius-control);padding:var(--space-12);font-family:inherit;font-size:var(--font-size-body);line-height:1.7;color:var(--color-text-primary);background:var(--surface-page)}
.it-intro:focus{outline:2px solid var(--color-brand);outline-offset:-1px;border-color:var(--color-brand)}
.it-cnt{font-size:var(--font-size-caption);color:var(--color-text-tertiary);text-align:right}
.it-pv{flex:1 1 auto;min-height:300px;overflow:auto;border:1px solid var(--color-border-hairline);border-radius:var(--radius-control);padding:var(--space-16);background:var(--surface-subtle);font-size:var(--font-size-body);line-height:1.7;color:var(--color-text-body)}
.it-pv h4{margin:0 0 var(--space-8);font-size:var(--font-size-heading);font-weight:600;color:var(--color-text-primary)}
.it-pv p{margin:0 0 var(--space-8)}
.it-pv code{font-family:var(--font-family-mono);font-size:var(--font-size-caption);background:var(--surface-sunken-2);border-radius:var(--radius-xs);padding:1px 4px}
.it-pv pre{margin:0 0 var(--space-8);padding:var(--space-12);background:var(--surface-page);border-radius:var(--radius-tag);overflow:auto}
.it-pv pre code{background:none;padding:0}
/* 导入项目的结果行：可勾选合并、名称可改 */
.it-res li{display:flex;align-items:center;gap:var(--space-8)}
.it-mk{flex:0 0 auto;margin:0}
.it-rn{flex:0 0 200px;height:28px;padding:0 var(--space-8);border:1px solid var(--color-border-control);border-radius:var(--radius-control);font-family:inherit;font-size:var(--font-size-body);color:var(--color-text-primary);background:var(--surface-page)}
.it-rn:focus{outline:2px solid var(--color-brand);outline-offset:-1px;border-color:var(--color-brand)}
.it-res li > span{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it-pv-hd{display:flex;align-items:center;gap:var(--space-8)}
.it-lb .req{font-style:normal;color:var(--color-danger);margin-right:2px}
.it-name-in{flex:1 1 auto;min-width:0;height:28px;border:1px solid var(--color-border-control);border-radius:var(--radius-control);padding:0 var(--space-8);font-family:inherit;font-size:var(--font-size-body);color:var(--color-text-primary);background:var(--surface-page)}
.it-name-in:focus{outline:2px solid var(--color-brand);outline-offset:-1px;border-color:var(--color-brand)}
.it-sp{flex:1 1 auto}
.it-file{display:flex;align-items:center;gap:var(--space-8);margin-top:var(--space-8)}
.it-res{margin:var(--space-12) 0 0;padding:0;list-style:none;max-height:260px;overflow:auto}
.it-res li{display:flex;align-items:center;gap:var(--space-8);padding:var(--space-8) 0;border-bottom:1px solid var(--color-border-hairline);font-size:var(--font-size-body)}
.it-res li b{font-weight:500;color:var(--color-text-primary)}
.it-res li span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--color-text-secondary)}
.it-res li button{margin-left:auto}
</style>
</head>
<body>

<div class="app">
  <nav class="sider" data-active="cap-apis"></nav>
  <div class="workspace">
    <header class="hdr">
      <nav class="crumb">
        <b>配置管理</b>
        <span class="sep" aria-hidden="true"><svg aria-hidden="true" viewBox="0 0 14 14" fill="currentColor"><path d="M4.396 2.146a.5.5 0 0 0-.057.638l.057.07L8.543 7l-4.147 4.146a.5.5 0 0 0-.057.638l.057.07a.5.5 0 0 0 .638.057l.07-.057 4.5-4.5a.5.5 0 0 0 .057-.638l-.057-.07-4.5-4.5a.5.5 0 0 0-.708 0Z"/></svg></span>
        <b>能力配置</b>
      </nav>
      <div class="me"><span>admin</span><u>ad</u></div>
    </header>

    <main class="main">
      <h1 class="sr-only">接口清单</h1>

      <!-- 真源形态：面包屑下紧跟一条工具条（左操作、右筛选），然后直接是表格。 -->
      <div class="it-bar">
        <button type="button" class="btn ghost" id="act-import">导入</button>
        <button type="button" class="btn ghost" id="act-export">导出</button>
        <span class="bar-sp"></span>
        <label class="field w220"><input id="kw" placeholder="搜名称、描述、来源" autocomplete="off"></label>
        <label class="field w120"><select id="f-state"><option value="">状态</option><option value="ok">生成成功</option><option value="run">生成中</option><option value="fail">生成失败</option></select></label>
        <label class="field w120"><select id="f-on"><option value="">是否启用</option><option value="1">已启用</option><option value="0">已停用</option></select></label>
      </div>

      <div class="it-table gtable">
        <div class="gtable-head" id="head" aria-hidden="true"></div>
        <div class="gtable-body" id="list" role="list" aria-label="能力列表"></div>
        <div class="gtable-foot"><span id="total"></span><span class="it-pager" id="pager"></span><span class="it-pg">15 条/页</span></div>
      </div>
    </main>
    <div id="toast" class="toast" data-on="false" role="status" aria-live="polite"></div>
  </div>
</div>

<!-- 新增 / 编辑 -->
<div class="nf-mask" id="dlg" hidden>
  <div class="nf nf-wide" role="dialog" aria-modal="true" aria-labelledby="dlg-t">
    <div class="nf-hd">
      <b id="dlg-t">接入</b>
      <button type="button" class="icon-btn" id="dlg-x" aria-label="关闭">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="nf-bd">
      <div class="it-two">
        <div class="it-col">
          <!-- 2026-11-05（用户）：介绍放最上、给到 2–3 行；来源由模型从内容里分析，不让用户填。
               「原文」这个词也换掉——用户贴进来的不只原文，也可能是一份文档。 -->
          <label class="it-lb" for="intro">介绍</label>
          <textarea class="it-intro" id="intro" placeholder="选填"></textarea>
          <label class="it-lb" for="raw">内容</label>
          <!-- 2026-11-05（用户）：不设上传。贴 JSON / 贴文本 / 贴 cURL 都走这一个框，
               整份 OpenAPI 贴进来会自动拆成多条。没有文件选择，用户也不用猜该选什么。 -->
          <textarea class="it-raw" id="raw" placeholder="贴 URL、cURL、JSON，或者一段大白话"></textarea>
          <span class="it-cnt" id="cnt">0 字</span>
        </div>
        <div class="it-col">
          <!-- 多条：贴整份文档 / OpenAPI 时自动切到这块 -->
          <div id="multi" hidden>
            <div class="it-pv-hd">
              <span class="it-lb" id="multi-hint">解析出多条，逐条确认</span>
              <button type="button" class="it-op" id="bd-merge" disabled>合并所选</button>
            </div>
            <ul class="it-res" id="bres"></ul>
          </div>
          <div id="single">
            <div class="it-pv-hd">
              <label class="it-lb" for="pv-name"><i class="req">*</i>能力名称</label>
            </div>
            <input class="it-name-in" id="pv-name" placeholder="必填">
            <div class="it-pv-hd" style="margin-top:var(--space-12)">
              <span class="it-lb">能力说明书</span>
            </div>
            <textarea class="it-raw" id="pv-md" aria-label="能力说明书内容" placeholder="生成后可以直接改"></textarea>
            <div class="it-pv" id="pv" hidden></div>
          </div>
        </div>
      </div>
    </div>
    <div class="nf-ft">
      <button type="button" class="btn ghost" id="gen">生成说明书</button>
      <span class="it-sp"></span>
      <button type="button" class="btn ghost" id="dlg-cancel">取消</button>
      <button type="button" class="btn primary" id="dlg-save" disabled>保存</button>
    </div>
  </div>
</div>

<!-- 详情：只读看 MD 文档与原始内容；要改再进编辑 -->
<div class="nf-mask" id="det" hidden>
  <div class="nf" role="dialog" aria-modal="true" aria-labelledby="det-t">
    <div class="nf-hd">
      <b id="det-t">详情</b>
      <button type="button" class="icon-btn" id="det-x" aria-label="关闭">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="nf-bd" id="det-bd"></div>
    <div class="nf-ft">
      <span class="it-sp"></span>
      <button type="button" class="btn ghost" id="det-close">关闭</button>
    </div>
  </div>
</div>

<script src="assets/shell.js?v=e279ad97"></script>
<script src="assets/ui-kit.js?v=5a79564d"></script>
<script src="assets/confirm.js?v=162e2372"></script>
<script src="assets/spec.js?v=8e057186"></script>
<script src="assets/list.js?v=72bd485b"></script>
<script src="assets/capability.js?v=92dbad3c"></script>
<!-- ★2026-11-09：这一页的「导入」「导出」依赖 Transfer（下载/选文件）。
     原来没引它 —— 导出点了只弹 toast、文件不下载；导入点了直接 return、毫无反应。
     app-manage.html 与 components.html 一直有引，这页漏了。 -->
<script src="assets/transfer.js?v=d79dd74b"></script>
<script src="assets/interfaces.js?v=7eab8da8"></script>
</body>
</html>
