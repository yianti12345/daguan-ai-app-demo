<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>授权总览 · AI 应用方案</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23587FFF'/%3E%3Crect x='8' y='9' width='16' height='3' rx='1.5' fill='white'/%3E%3Crect x='8' y='15' width='11' height='3' rx='1.5' fill='white' opacity='.75'/%3E%3Crect x='8' y='21' width='7' height='3' rx='1.5' fill='white' opacity='.5'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/tokens.css?v=308f06b8">
<link rel="stylesheet" href="assets/sys.css?v=ed346b89">
<link rel="stylesheet" href="assets/client-auth.css?v=f19fefa2">
  <meta name="robots" content="noindex,nofollow">
</head>
<body>

<div class="app">
  <!-- 2026-11-01：客户授权不是一级模块，高亮跟着「应用管理」走（它属于应用）。 -->
  <nav class="sider" data-active="apps"></nav>
  <div class="workspace">
    <header class="hdr">
      <!-- 2026-11-02（独立走查 P1-3）：分隔符与 apps.html 统一成 ›；带 id 时把应用名放进面包屑
           （可点回配置页），末级固定「客户授权」——原来末级是应用名、h1 又写一遍应用名+客户授权。 -->
      <nav class="crumb">
        <b>AI 应用方案</b>
        <span class="sep" aria-hidden="true"><svg aria-hidden="true" viewBox="0 0 14 14" fill="currentColor"><path d="M4.396 2.146a.5.5 0 0 0-.057.638l.057.07L8.543 7l-4.147 4.146a.5.5 0 0 0-.057.638l.057.07a.5.5 0 0 0 .638.057l.07-.057 4.5-4.5a.5.5 0 0 0 .057-.638l-.057-.07-4.5-4.5a.5.5 0 0 0-.708 0Z"/></svg></span>
        <a href="apps.html">应用管理</a>
        <span class="sep" aria-hidden="true"><svg aria-hidden="true" viewBox="0 0 14 14" fill="currentColor"><path d="M4.396 2.146a.5.5 0 0 0-.057.638l.057.07L8.543 7l-4.147 4.146a.5.5 0 0 0-.057.638l.057.07a.5.5 0 0 0 .638.057l.07-.057 4.5-4.5a.5.5 0 0 0 .057-.638l-.057-.07-4.5-4.5a.5.5 0 0 0-.708 0Z"/></svg></span>
        <a id="crumb-app" href="apps.html" hidden>应用</a>
        <span class="sep" id="crumb-sep2" aria-hidden="true" hidden><svg aria-hidden="true" viewBox="0 0 14 14" fill="currentColor"><path d="M4.396 2.146a.5.5 0 0 0-.057.638l.057.07L8.543 7l-4.147 4.146a.5.5 0 0 0-.057.638l.057.07a.5.5 0 0 0 .638.057l.07-.057 4.5-4.5a.5.5 0 0 0 .057-.638l-.057-.07-4.5-4.5a.5.5 0 0 0-.708 0Z"/></svg></span>
        <b id="crumb-page">授权总览</b>
      </nav>
      <div class="me"><span>admin</span><u>ad</u></div>
    </header>

    <main class="main">
      <!-- 2026-11-02（独立走查 P1-3）：平台标准件（员工管理页）与 apps.html 都没有页内大标题，
           标题由面包屑承担。这里删掉可见 h1（否则同一句话在面包屑和正文各写一遍，
           工具条也被压低 52px），只留读屏可读的 h1。 -->
      <h1 id="pg-title" class="sr-only">授权总览</h1>

      <!-- 2026-11-02 第二次整改（用户 m04120）：
           「为什么 2 块列表？狗屎逻辑」——原来上面是授权记录、下面是客户台账，同一批客户
           出现两次，两处"新增"（新增授权 / 新增客户）也分不清。现在合成一张：
           一行 = 一家客户；授权了就有版本/时间/有效期与升级动作，没授权就是「授权」入口。
           样式照线上平台的标准列表（员工管理页）：灰色表头、通栏行、文字链操作、右侧分页。 -->
      <div class="au-card">
        <div class="au-bar">
          <!-- 工具栏照平台标准（员工管理页）：主按钮在左，搜索在右。
               最新版本是这张表的"基准"，跟搜索一起靠右，不单独占一行。 -->
          <button class="btn primary" type="button" id="act-add">新增客户授权</button>
          <!-- ★2026-11-03（m05719）：多选后批量升级。没选时是「一键升级（0）」且禁用，
               选 2 个可升级的客户就变「一键升级（2）」。 -->
          <!-- ★2026-11-05：三件事分开说清 ——
               全部升级（N）= 当前筛选里所有落后的客户，不看勾选（1000 家的主路径）；
               批量升级（N）= 只升勾选的（跨页、跨筛选都算）。 -->
          <!-- 整句包在一个 span 里：.btn 是 flex + gap:8px，直接放「文字 + span + 文字」
               会被撑成「全部升级（ 3 ）」——括号里多出两道 8px 缝（2026-11-05 截图抓到的）。 -->
          <button class="btn ghost" type="button" id="act-all" hidden><span>全部升级（<span id="all-n">0</span>）</span></button>
          <button class="btn ghost" type="button" id="act-batch" hidden><span>批量升级（<span id="batch-n">0</span>）</span></button>
          <div class="right">
            <span class="au-latest" id="au-latest" hidden>最新版本 <b>—</b></span>
            <label class="field w120">
              <!-- ★2026-11-04（用户）：按版本筛客户。选项由 client-auth.js 按最新版本现填。 -->
              <select id="f-ver" aria-label="按授权版本筛选">
                <option value="">全部版本</option>
              </select>
            </label>
            <label class="field w180">
              <input id="kw" placeholder="搜客户或租户 ID" autocomplete="off">
            </label>
          </div>
        </div>
        <!-- ★2026-11-05：批量升级的回执。原来只有 3.2 秒的 toast，
             1000 家升完连"升了几家、有没有失败"都来不及看，误点的也没处退。 -->
        <div class="notice" id="bulk-result" data-kind="ok" hidden>
          <span id="bulk-result-t"></span>
        </div>
        <div class="au-table gtable">
          <div class="au-head gtable-head" id="head">
            <span class="au-sel"><input type="checkbox" id="au-all" aria-label="全选可升级客户"></span>
            <span>客户</span><span>租户 ID</span><span>应用</span><span>授权版本</span><span>授权时间</span><span>有效期</span><span>操作</span>
          </div>
          <div class="au-body gtable-body" id="list" role="list" aria-label="客户授权列表"></div>
          <div class="au-foot gtable-foot">
            <span id="total"></span>
            <span class="au-pager" id="pager"></span>
          </div>
        </div>
      </div>
    </main>
    <div id="toast" class="toast" data-on="false" role="status" aria-live="polite"></div>
  </div>
</div>

<!-- 新增/编辑客户：名字 + 租户 ID。两个都必填且唯一 —— 重名会让"这家有几个应用"永远算错。 -->
<div class="mask" id="cl-mask" data-open="false">
  <div class="panel au-dlg" role="dialog" aria-modal="true" aria-labelledby="cl-title">
    <div class="p-hd">
      <b id="cl-title">新建客户</b>
      <button class="p-x" type="button" id="cl-x" aria-label="关闭">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="p-bd au-bd">
      <div class="fm">
        <div class="fm-row">
          <label for="cl-name">客户名称</label>
          <input id="cl-name" maxlength="20" placeholder="比如：中金公司" autocomplete="off">
        </div>
        <div class="fm-row">
          <label for="cl-tenant">租户 ID</label>
          <input id="cl-tenant" maxlength="32" placeholder="甲方系统里的租户 ID" autocomplete="off">
        </div>
      </div>
    </div>
    <div class="p-ft au-ft">
      <button class="btn ghost" type="button" id="cl-cancel">取消</button>
      <button class="btn primary" type="button" id="cl-ok">保存</button>
    </div>
  </div>
</div>

<!-- 新增客户授权（2026-11-05 照真源重做）：
     真源弹窗 520×202，只有「选择客户」一个字段 + 取消/确定。
     原来这里有「授权版本」「有效期」两行 —— 真源没有，是我自己发明的，已删。
     「应用」这一行只在一级页面（授权总览）出现，进了某个应用就隐藏（上下文已定）。
     一次可选多家客户：同一应用下各家各有一条授权记录。 -->
<div class="mask" id="mask" data-open="false">
  <div class="panel au-dlg" role="dialog" aria-modal="true" aria-labelledby="dlg-title">
    <div class="p-hd">
      <b id="dlg-title">新增客户授权</b>
      <button class="p-x" type="button" id="dlg-x" aria-label="关闭">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="p-bd au-bd">
      <div class="fm">
        <div class="fm-row">
          <label for="fm-app">应用</label>
          <select id="fm-app"></select>
        </div>
        <!-- 真源是一个可展开的「选择客户」下拉（弹窗常态 202 高）。
             这里用同一个形态：触发器说得清选了几家，点开才出列表。 -->
        <div class="fm-row">
          <span class="fm-label" id="fm-pick-lb">选择客户</span>
          <button class="field" type="button" id="fm-trigger" aria-expanded="false" aria-controls="fm-list-wrap">
            <span id="fm-picked">请选择客户</span>
          </button>
          <div class="fm-row" id="fm-list-wrap" hidden>
            <label class="field"><input id="fm-kw" type="text" placeholder="搜客户名称或租户 ID" autocomplete="off"></label>
            <div class="fm-clients" id="fm-clients" role="group" aria-label="选择客户"></div>
          </div>
        </div>
        <!-- 数据层要一个有效期，但真源新增时不问它（到期在行内「配置」里设），默认 12 个月 -->
        <div class="fm-row" hidden>
          <select id="fm-exp"><option value="12" selected>12 个月</option></select>
        </div>
      </div>
    </div>
    <div class="p-ft au-ft">
      <button class="btn ghost" type="button" id="dlg-cancel">取消</button>
      <button class="btn primary" type="button" id="dlg-ok">确定</button>
    </div>
  </div>
</div>

<script src="assets/data.js?v=80ca53d9"></script>
<script src="assets/ui-kit.js?v=bc773bc9"></script>
<script src="assets/confirm.js?v=ad0ffde9"></script>
<script src="assets/spec.js?v=837054ad"></script>
<script src="assets/list.js?v=99cbc618"></script>
<script src="assets/shell.js?v=1736883e"></script>
<script src="assets/client-auth.js?v=74eec255"></script>
</body>
</html>
