<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>服务器地址</title>
<style>
  :root{
    --brand:#587FFF; --brand-dark:#2F55C0; --ink:rgba(0,0,0,.9); --ink2:rgba(0,0,0,.65);
    --line:#E6E9F2; --bg:#FFFFFF; --page:#F5F7FB;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--page); color:var(--ink);
    font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    display:flex; align-items:center; justify-content:center;
    -webkit-user-select:none; user-select:none;
  }
  .card{width:420px; background:var(--bg); border-radius:14px; padding:26px 26px 22px; box-shadow:0 10px 30px rgba(23,35,77,.08)}
  h1{margin:0 0 6px; font-size:17px; letter-spacing:.2px}
  p{margin:0 0 18px; color:var(--ink2); font-size:13px}
  label{display:block; font-size:12px; color:var(--ink2); margin-bottom:6px}
  input{
    width:100%; height:38px; padding:0 12px; border:1px solid var(--line); border-radius:9px;
    font:inherit; color:var(--ink); outline:none; -webkit-user-select:text; user-select:text;
  }
  input:focus{border-color:var(--brand); box-shadow:0 0 0 3px rgba(88,127,255,.16)}
  .err{margin-top:8px; font-size:12px; color:#D92D20; min-height:18px}
  .row{display:flex; align-items:center; gap:10px; margin-top:6px}
  button{
    height:38px; padding:0 18px; border:0; border-radius:9px; background:var(--brand); color:#fff;
    font:inherit; font-weight:500; cursor:pointer;
  }
  button:hover{background:var(--brand-dark)}
  button:disabled{opacity:.55; cursor:default}
  .ver{margin-left:auto; font-size:12px; color:var(--ink2)}
</style>
</head>
<body>
  <form class="card" id="f">
    <h1>连接到你的服务器</h1>
    <p>填写平台地址。留空直接用默认地址也可以。</p>
    <label for="u">服务器地址</label>
    <input id="u" type="url" spellcheck="false" autocomplete="off" placeholder="http://127.0.0.1:8941/apps.html">
    <div class="err" id="e" role="alert"></div>
    <div class="row">
      <button id="ok" type="submit">进入</button>
      <span class="ver" id="v"></span>
    </div>
  </form>
<script>
  var $ = function (s) { return document.querySelector(s); };
  var input = $('#u'), err = $('#e'), ok = $('#ok');
  window.clientSetup.get().then(function (c) {
    input.value = c.server || '';
    $('#v').textContent = '客户端 ' + c.version;
    input.focus(); input.select();
  });
  $('#f').addEventListener('submit', function (e) {
    e.preventDefault();
    ok.disabled = true; err.textContent = '';
    window.clientSetup.save(input.value.trim()).then(function (r) {
      ok.disabled = false;
      if (!r.ok) { err.textContent = r.msg; input.focus(); }
    });
  });
</script>
</body>
</html>
