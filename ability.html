<body class="cap-workspace">
<div class="app">
  <nav class="sider" data-active="cap-abilities"></nav>
  <div class="workspace">
    <header class="hdr">
      <nav class="crumb">
        <b>资产中心</b>
        <span class="sep" aria-hidden="true"><svg aria-hidden="true" viewBox="0 0 14 14" fill="currentColor"><path d="M4.396 2.146a.5.5 0 0 0-.057.638l.057.07L8.543 7l-4.147 4.146a.5.5 0 0 0-.057.638l.057.07a.5.5 0 0 0 .638.057l.07-.057 4.5-4.5a.5.5 0 0 0 .057-.638l-.057-.07-4.5-4.5a.5.5 0 0 0-.708 0Z"/></svg></span>
        <b><a href="abilities.html">能力管理</a></b>
        <span class="sep" aria-hidden="true"><svg aria-hidden="true" viewBox="0 0 14 14" fill="currentColor"><path d="M4.396 2.146a.5.5 0 0 0-.057.638l.057.07L8.543 7l-4.147 4.146a.5.5 0 0 0-.057.638l.057.07a.5.5 0 0 0 .638.057l.07-.057 4.5-4.5a.5.5 0 0 0 .057-.638l-.057-.07-4.5-4.5a.5.5 0 0 0-.708 0Z"/></svg></span>
        <b id="crumb-name">新建能力</b>
      </nav>
    </header>

    <main class="main">
      <h1 class="sr-only">能力详情</h1>
      <div class="abt-bar">
        <button type="button" class="btn primary" id="act-save" disabled>保存</button>
        <span class="abt-state" id="md-state"></span>
      </div>

      <div class="abt-two">
        <div>
          <label class="abt-lb" for="f-name"><i aria-hidden="true">*</i>能力名称</label>
          <input class="abt-in" id="f-name" placeholder="这个能力叫什么">
          <label class="abt-lb" for="f-intro" style="margin-top:var(--space-12)">说明</label>
          <textarea class="abt-ta" id="f-intro" placeholder="什么时候该用它，一句话"></textarea>

        </div>

        <div>
          <div class="abt-sec" style="margin-top:0"><b>能力说明书</b>
            <button type="button" class="btn ghost" id="act-gen">生成</button>
          </div>
          <textarea class="abt-doc-ta" id="doc" aria-label="能力说明书" spellcheck="false" placeholder="点右上「生成」，或直接写"></textarea>
        </div>
      </div>

      <!-- ★2026-11-09（用户：「接口的具体信息我现在完全看不到，还需要每个单独编辑看下」）：
           接口清单从左侧半栏移到通栏。半栏 1440 下只有 589px、900 下 319px，
           四列入参表每列不到 80px，信息根本摆不下。
           #api-title 保留且父节点仍是 .abt-sec —— ability.js 靠它的 parentNode 插「添加接口」。 -->
      <div class="abt-sec"><b id="api-title">接口清单（0）</b></div>
      <div class="api-list" id="api-list"></div>
    </main>
    <div id="toast" class="toast" data-on="false" role="status" aria-live="polite"></div>
  </div>
</div>
