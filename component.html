<style>

/* ─────────────────────────────────────────────────────────────
   本页局部排版。不新增任何取值：颜色/字号/圆角/阴影全部走 tokens.css
   与 base.css 已有的变量，这里只负责"放在哪、多宽、什么时候出现"。

   形态：一块全屏画布 = 最终页面本身，输入条浮在最顶层。
   没有顶栏、没有侧栏、没有「预览」这个动作 —— 说完就边生成边长出来。
   ───────────────────────────────────────────────────────────── */



/* ★2026-10-26 撤销「本页隐藏浮球」。
   10-25 那条 P0 的前提是错的：它把「底部输入轴」和「右下浮球」当成两个同类 AI 入口。
   用户 10-26 原话纠正：「小智是全局的，就是小智可以跟人一样，操作我们 web 端全部的操作，
   跟组件配置的对话和应用配置的对话，是完全不同的概念」。
   ⇒ 输入轴是**本页的配置对话**（只管这一屏的对象），浮球是**全局操作者**（能操作整个系统）。
   两者不是重复入口，隐藏浮球等于砍掉全局能力，且用户在别的页找不到它就不会知道它存在。
   如果同屏真的显得挤，该调的是浮球的视觉重量（尺寸/透明度/层级），不是取消它。 */

/* 生成进度：一条 3px 的确定进度（不做循环动画，DESIGN §6 禁循环） */
#genbar{
  position:fixed; top:0; left:0; height:3px; width:0;
  background:var(--color-brand); z-index:45;
  transition:width .26s ease, opacity .2s;
}
#genbar[data-off="true"]{opacity:0}

/* ── 画布 ────────────────────────────────────────────────────
   顶部留出悬浮条的高度：条是浮层，内容滚到上面时从条下面过。
   ★ 2026-10-23 用户说"画布的颜色太丑"：原来是一整片均匀的 #F5F6F9，
     空态只有中间一小团内容，四周全是同一种灰 —— 眼睛没有落点。
     现在给一层极淡的径向渐变（中心近白、四周回到画布灰），
     视觉重心自然落在中间那块内容上；画布本身仍然是灰的，
     所以和「内容区白、卡片白」这套底色规则不冲突（生成出来的白卡照样立得住）。 */
#canvas{
  flex:1; min-height:0; overflow:auto;
  /* ★2026-11-04（用户 m01223）：「组件配置页完全样式变形，跟应用配置页基本类似」。
     原来这里是一块纯白 #surface-page（2026-10-25 那次是给"列表页工作区"定的口径），
     应用配置页却是灰底 + 极淡径向渐变；两页同一件事（画布），底不能两样。
     底与底距全部改成和应用页同一组值。 */
  padding:72px 24px var(--fk-clear-bottom);
  background:var(--gradient-stage),var(--surface-canvas);
}
.canvas-inner{max-width:1202px; margin: 0 auto}/* 1202 = 列表页内容区实测宽度（x=216..1418），三页右缘对齐 */
/* 画布铺满，不切短：切短会在底部露出 body 白底，看起来像"页面没铺满"。
   底部对话浮层就浮在画布上，留白交给 #canvas 的 padding-bottom。 */

/* 失败提示：画布内的一条（对话框已经归 float.js 管，不再往条上挂东西） */
.err-strip{
  display:flex; align-items:center; gap: 8px;
  max-width:1080px; margin: 0 auto 12px; padding: 8px 12px;
  border-radius:var(--radius-panel); background:var(--color-warning-surface); color:var(--color-danger);
  border:1px solid var(--color-border-card); font-size:var(--font-size-caption); line-height:1.5;
}
.err-strip .strip-act{font-size:var(--font-size-caption); color:var(--color-danger); text-decoration:underline; text-underline-offset:2px}

/* 发布结果：对话框上方浮一条，5 秒自动消失（不阻断） */
#pub{
  position:fixed; left:50%; transform:translateX(-50%);
  bottom:calc(24px + 56px + 12px); z-index:44;
  display:flex; align-items:center; gap: 8px;
  padding: 8px 14px; border-radius:var(--radius-pill);
  background:var(--color-text-body); color:var(--color-text-inverse); font-size:var(--font-size-caption);
  box-shadow:var(--shadow-floating);
}

/* 段落入场：8px 上移 + 淡入 */
.cstep{animation:cstep .3s ease both}
@keyframes cstep{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}
@media (prefers-reduced-motion:reduce){.cstep{animation:none}}

/* 状态条统一到 sys.css 的 .status（原来这里是 .bd-status：橙底 + 32 高 + 12 号，
   与 app.html 的蓝底 + 40 高 + 14 号是同一件东西的两份实现） */

/* ★ 2026-10-23：空白不是靠"把卡片改矮"解决的 —— 那是把一页变成一张残卡。
   正解是**让留白有结构**：左栏灰底一直铺到卡片底部，右侧白区被灰底框住，
   空白就成了"右栏的呼吸"，而不是"卡片没画完"。
   min-height:430 已撤（有 flex:1 就不需要兜底高度）。 */
mark{background:var(--color-brand-surface-2); color:var(--color-text-body); padding: 0 2px; border-radius:var(--radius-xs)}

.trail-row{display:grid; grid-template-columns:76px 52px minmax(0,1fr); gap:8px;
  padding: 8px 12px; border-bottom:1px solid var(--color-border-hairline); font-size:var(--font-size-caption); color:var(--color-text-secondary)}
.trail-row:last-child{border-bottom:0}
.trail-t{color:var(--color-text-tertiary); font-variant-numeric:tabular-nums}
.trail-who{color:var(--color-text-body)}
.trail-txt{min-width:0}

/* 表单页骨架：**单列**居中 —— 和工作台的双栏在结构上就不同，
   不能只是换个标题（用户要的是"装了个东西，界面确实变了"）。 */
/* 这里原来有一条 `.bd-group + .bd-group{margin-top:18px}` —— 与上面 `.page > .bd-group`
   的 12px 特异性相同、位置更后，于是同一页里出现 12 和 18 两种块间距（实测 gaps=[12,18,12]）。
   删掉：块间距只能有一个来源，多一条就多一种"看着像没对齐"的感觉。 */

/* toast 挪到底部中间，别压画布内容 */
.toast{bottom:calc(24px + 56px + 60px)}

/* ── 预览里的勾选列 / 批量带 / 筛选控件（2026-10-26）──────────────
   组件库预览页是"这个组件长什么样"的唯一凭据，而同一个组件在应用画布里
   有首列勾选（表头全选 + 行内单选）、批量带、行内选人、真改处理人；
   预览页原来只有一张静态表 + 一颗点不动的「全部（状态）」。
   同一块在两处是两个形态，看预览的人就会以为它只能看、不能批量处理。

   ⚠ 这一段与 app.html 里那段是同一套规则（同一组件 → 同一形态）。
     本轮写域只到本页，sys.css 归另一个改动域，暂时各存一份；
     合并时应收进 sys.css，两页共用一份。
   ⚠ 取值全部走 token：40 宽 = 16 复选框 + 24（左内距 12 + 右留白 12）。
   ⚠ hover / 展开只换底色，不用 transform —— 画布里有 position:fixed 的
     输入条与提示条，祖先一旦有 transform，它们的定位基准就跟着变。 */
.tb-ck{width:calc(var(--space-16) + var(--space-24));padding-right:0}
.tb-ck input,.tb-pick-row input{width:var(--space-16);height:var(--space-16);margin:0;accent-color:var(--color-brand);cursor:pointer}
.tb-ck input:focus-visible,.tb-pick-row input:focus-visible{outline:2px solid var(--color-focus-ring);outline-offset:2px}
.tb-batch{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-8);padding:0 0 var(--space-8)}
.tb-batch > b{font-size:var(--font-size-caption);font-weight:600;color:var(--color-text-secondary);font-variant-numeric:tabular-nums}
.tb-batch-btn{
  height:var(--space-24);padding:0 var(--space-8);border:0;border-radius:var(--radius-sm);
  background:var(--color-brand-surface);color:var(--color-brand-ink);font-size:var(--font-size-caption);line-height:1;cursor:pointer;
  transition:background .16s;
}
.tb-batch-btn:hover,.tb-batch-btn[aria-expanded="true"]{background:var(--color-brand-surface-2)}
.tb-batch-btn[disabled]{background:var(--surface-sunken-2);color:var(--color-text-tertiary);cursor:not-allowed}
.tb-batch-cancel{background:var(--surface-sunken-2);color:var(--color-text-secondary)}
.tb-batch-cancel:hover{background:var(--color-state-selected)}
.tb-pick{
  flex:1 0 100%;display:flex;align-items:center;gap:var(--space-16);
  padding:var(--space-8) var(--space-12);border-radius:var(--radius-sm);background:var(--surface-sunken-2);
}
.tb-pick-list{display:flex;align-items:center;gap:var(--space-16);min-width:0}
.tb-pick-row{
  display:inline-flex;align-items:center;gap:var(--space-4);
  font-size:var(--font-size-caption);color:var(--color-text-body);cursor:pointer;
}
.tb-pick-ok{
  margin-left:auto;height:var(--space-24);padding:0 var(--space-12);border:0;border-radius:var(--radius-sm);
  background:var(--color-brand-surface);color:var(--color-brand-ink);font-size:var(--font-size-caption);cursor:pointer;
}
.tb-pick-ok:disabled{background:var(--surface-subtle);color:var(--color-text-tertiary);cursor:not-allowed}
/* 筛选是真控件：外观沿用 .bd-chip 那颗胶囊，只补表单元素必须有的三样
   （手型 / 键盘焦点 / 原生下拉的读法），不复刻一套新样式。 */
.bd-chip-sel{display:inline-block;cursor:pointer;padding-right:var(--space-4)}
.bd-chip-sel:focus-visible{outline:2px solid var(--color-focus-ring);outline-offset:2px}

</style>

<body data-comp="">

<div class="app">
  <!-- ★2026-10-25 撤掉侧栏（装回来过一天，又撤了）。
       装的理由：盲评第四/五轮连续两条 P1 ——「遮掉文字后 p2 只剩一张浮卡和一条输入条，
       判为另一个产品」「p2 没有 196px 侧栏，像换了一套框架」。
       撤的理由（优先级更高）：`tools/check-consistency.mjs` 的 C6 判据写着
       「配置页不该有平台导航（.sider）—— 用户已明确说过」——这是用户当面定的规则，
       评审席不知道这条约束。装上之后 C6 当场判红、J3 判「nav 一边有一边没有」、
       J6 判「画布 1240×900 未铺满 1440」。
       ⇒ 结论：**评审席的建议与用户已明确的规则冲突时，规则优先**；
          「体系像不像一套」改用别的手段满足（同一套令牌、同宽 1202 内容列、
          同一条面包屑起点、同一底色），不靠把导航塞进沉浸式编辑页。 -->
  <!-- 左上角浮层：返回 + 组件名（组件名由 JS 填，静态文案里不出现场景词） -->
  <div class="topbar">
    <div class="float-hd">
      <a class="back" href="components.html" aria-label="返回组件库">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <div class="hd-main">
        <div class="hd-top">
          <h1 class="app-name" id="comp-name">组件配置</h1>
          <span class="app-edit" id="comp-ver"></span>
          <span class="app-edit" id="comp-meta"></span>
        </div>
        <!-- 这一页东西的介绍：超长单行省略，点一下看全文（小弹窗） -->
        <p class="hd-desc" id="comp-desc"></p>
      </div>
      <!-- 归位/状态这两个节点仍由 component.js 写（setCompName），但不再占顶栏位置：
           2026-11-04 用户 m01223 定口径「左上角只显示组件名称及版本号，版本时间、启用状态等」。 -->
      <span id="comp-app" hidden></span>
      <span id="comp-sep" hidden>/</span>
      <span id="comp-status" hidden></span>
    </div>
    <div class="tb-ops">
      <!-- 2026-11-05：装配能力的入口照应用配置页的「装配组件」——同一个动词、同一个面板形态，
           点开是可装配/已装配两段。能力只是给模型写这个组件时的能力清单。 -->
      <button type="button" class="btn ghost" id="act-apis">装配能力 <span class="count-badge" id="api-count">已装 0</span></button>
      <button type="button" class="btn ghost" id="act-draft">保存草稿</button>
      <button type="button" class="btn primary" id="act-publish">保存并发布版本</button>
    </div>
  </div>

  <!-- 画布：就是最终页面本身 -->
  <main class="canvas" id="canvas" aria-busy="false" data-busy="false" data-error="false">
    <!-- 报错要打断读屏当前朗读（assertive），不是排队等它念完（polite） -->
    <div class="err-strip" id="err-strip" role="alert" aria-live="assertive" hidden>
      <span id="err-txt">这次没生成出来</span>
      <button type="button" class="strip-act" id="btn-retry">重试</button>
    </div>
    <!-- 配置器条（assets/configurator.js 画：配置器选择 / 导入 / 设为默认）。
         只在 ?cfg=<id> 或 ?cfgbar=1 时出现；不带参数时整条 hidden，
         零高度零占位 —— 所以默认访问与拆分前逐像素一致。 -->
    <div class="cfg-bar" id="cfg-bar" hidden></div>
    <div class="canvas-inner" id="canvas-inner"></div>
  </main>

  <!-- 发布结果（底部对话框上方，5 秒自动消失） -->
  <div id="pub" hidden><span id="pub-tt" role="status" aria-live="polite"></span></div>

  <div class="toast" id="toast" role="status" aria-live="polite" data-kind="info" data-on="false"></div>
</div>
