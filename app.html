/* ─────────────────────────────────────────────────────────────
   应用配置页 · 页面胶水（2026-10-29 结构债第一批：内联 35,517 B → 0）
   本页已无组件样式。全部归位 assets/sys.css?v=53dbaf75，按段名 grep：
     「画布壳 · Canvas Shell」   .canvas / .topbar / .float-hd / .sheet / .blk
     「画布块 · Canvas Block」   .cv-blk* / .cv-op* / .view-ver / 客户视图 / 表格骨架
     「批量指派 · Batch Assign」 .tb-ck / .tb-batch* / .tb-pick*
     「结果提示条 · Toast」      .hint*（含抽屉开着时让位）
     「装配面板 · Assemble Panel」.mask / .panel / .p-* / 已装行有更新 / .btn-update / .btn-plain / .btn-text
     「内容块 · Content Blocks」 .flow* / .cmp / .orig / .fx / .rule-*
     「空态 · Empty State」      .cv-empty / .cv-say*
     「生成块 · Gen Shell」      .blk-bd--gen .bd-*
   两处页面级前缀：.canvas 挂 body[data-app]（component.html 也有 main.canvas，裸写会跨页泄漏）。
   本页只负责组装 + 业务数据。组件样式不许写回这里：
   同一种按钮在别的页面会各写一遍（check-component-first B/C 直接红）。 */
</style>

<body class="cap-workspace" data-app="">

<!-- 配置器容器（只在 ?cfg=1 时启用）。
     ⚠ 为什么这两个容器在 #canvas **外面**（别合并进去）：
       app.js 的 renderCanvas() 是 `cv.innerHTML = …` 整块重画，放进去会被擦掉；
       而擦掉**不报错**——表现只是"配置器条不见了"，会被当成样式问题查很久。
     放在外面则互不相干：不带 ?cfg 时两个都 hidden，零高度零占位；
       带 ?cfg=1 时 legacy #canvas 让位（configurator.js 按"是不是兄弟节点"判断，不按 id 写死）。 -->
<div class="cfg-bar" id="cfg-bar" hidden></div>

<!-- 画布：这个应用现在长什么样。装了什么就长什么，没装就是空的。 -->
<main class="canvas" id="canvas" aria-label="应用内容"></main>

<div class="hint" id="hint" role="status" aria-live="polite" data-on="false" data-kind="info"></div>

<div class="topbar">
  <div class="float-hd">
    <a class="back" id="act-back" href="app-manage.html" aria-label="返回应用管理">
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <div class="hd-main"><div class="hd-top"><h1 class="app-name" id="app-name" data-bind="app-name">应用配置</h1><span class="app-edit" id="app-edit"></span></div><p class="hd-desc" id="app-desc"></p></div>
  </div>
  <div class="tb-ops">


    <button type="button" class="btn quiet cap-entry" id="act-available">可用资产</button>
    <button type="button" class="btn ghost" id="act-draft">保存草稿</button>
    <button type="button" class="btn ghost" id="act-reset" disabled>重置</button>
    <!-- ★2026-11-03（用户 m01612）：配置页右上不再放「历史版本」——应用管理卡片的
         ⋮ 菜单已经有这个入口，同一个入口两处没有意义。
         ★2026-11-03（用户 m05120）：顶栏只留「保存草稿」和「保存新版本并发布」两件事。
         后者由 doPublish→commitPublish 一次完成：存快照 + 启用为当前客户可见版本。
         历史版本入口在 →apps.html 的卡片菜单。 -->
    <button type="button" class="btn primary" id="act-publish" title="保存为新版本并发布，客户升级仍在客户授权中处理">保存并发布</button>
    <!-- 2026-11-06（用户）：「saas 端出现大问题了…最终拼装的应用几乎都是个性化的，那么没有返回和平台的相关信息及操作了」。
         照 SaaS 真源应用内页实测补：头像 + 账号 + 组织两行 + 下拉，尺寸/层级与真源一致（条高 48）。
         拼装出来的应用是全屏的，这里是唯一的"我在哪个平台、我是谁"的锚点。 -->
    <div class="ab-wrap">
    <button type="button" class="ab-user" id="ab-user" aria-haspopup="true" aria-expanded="false" aria-controls="ab-menu" aria-label="当前账号 zheng，达观数据">
      <span class="ab-av" aria-hidden="true">郑</span>
      <span class="ab-nm"><b>zheng</b><i>达观数据</i></span>
      <svg class="ab-cv" aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <!-- 四项照用户 2026-11-06 截图逐项复刻：切换平台 / 修改密码 / 关于系统 / 退出登录 -->
    <div class="ab-menu" id="ab-menu" role="menu" hidden>
      <button type="button" class="ab-mi" role="menuitem">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h13l-3-3M20 16H7l3 3"/></svg>
        切换平台
      </button>
      <button type="button" class="ab-mi" role="menuitem">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
        修改密码
      </button>
      <button type="button" class="ab-mi" role="menuitem">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.6v.6"/></svg>
        关于系统
      </button>
      <button type="button" class="ab-mi is-out" role="menuitem">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4"/><path d="M9 8l4 4-4 4M13 12H4"/></svg>
        退出登录
      </button>
    </div>
    </div>
  </div>
