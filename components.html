     引用数格 `.cc-meta`（2026-10-29）都在 assets/sys.css 的组件层：
     前者两页共用，后者是组件卡的一个部件而不是页面胶水。

<body class="page-components">

<div class="app">

  <div class="workspace">
    <header class="hdr">
      <nav class="crumb">
        <a href="components.html">AI 应用方案</a>
        <span class="sep" aria-hidden="true"><svg aria-hidden="true" viewBox="0 0 14 14" fill="currentColor"><path d="M4.396 2.146a.5.5 0 0 0-.057.638l.057.07L8.543 7l-4.147 4.146a.5.5 0 0 0-.057.638l.057.07a.5.5 0 0 0 .638.057l.07-.057 4.5-4.5a.5.5 0 0 0 .057-.638l-.057-.07-4.5-4.5a.5.5 0 0 0-.708 0Z"/></svg></span>
        <b>组件库</b>
      </nav>
      <div class="me"><span>admin</span><u>ad</u></div>
    </header>
    <main class="main">
      <div class="bar">
        <button class="btn primary" type="button" id="btn-new">
          <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          新增组件
        </button>
        <!-- 2026-10-30：导入组件文件；与新建同级、权重更低 -->
        <button class="btn" id="btn-import" type="button">导入组件</button>
        <!-- ★2026-10-26 晚：计数挪到工具栏右端，与应用页同一个位置（原来它跟在「新增组件」
             按钮后面当尾巴，同一件事在两个页面长在两个地方）。
             筛选改成无标签 select：选项自己说清是什么，不用「状态：」当前缀。 -->
        <div class="right">
          <label class="field w180">
            <select id="f-st" style="border:0;background:transparent;outline:0;font:inherit;color:var(--color-text-body);width:100%">
              <option value="">全部状态</option>
              <option value="on">启用</option>
              <option value="off">禁用</option>
              <option value="draft">未发布</option>
            </select>
          </label>
          <label class="field w220">
            <input id="f-kw" placeholder="搜索组件名称" autocomplete="off">
          </label>
          <button class="icon-btn" id="refresh" aria-label="刷新">
            <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 10-2.5 5.7"/><path d="M20 5v6h-6"/></svg>
            <span class="rt" hidden>刷新中…</span>
          </button>
          <span id="total" class="bar-count" role="status" aria-live="polite">共 8 个组件</span>
        </div>
      </div>

      <!-- 组件卡片网格（2026-10-25 晚第三版形态）：不是表格，role 跟着改成 list。
           行表那版的 role="table" 留在卡片上就是错的语义 —— 卡片没有行列可念。 -->
      <div class="clist" id="grid" role="list" aria-label="组件列表"></div>

<!-- 新增组件：两样（名称 / 介绍）。2026-10-28 D1 删掉「启用状态」：新建即未发布，
     那时开关不改变任何结果；check-solid R6 仍按旧口径要 #nf-sw，属判据未跟上，待机制侧改。 -->
<div class="nf-mask" id="nf-mask" hidden>
  <div class="nf" role="dialog" aria-modal="true" aria-labelledby="nf-title">
    <div class="nf-hd">
      <b id="nf-title">新增组件</b>
      <button class="nf-x" type="button" id="nf-close" aria-label="关闭">
        <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="nf-bd">
      <div class="nf-row">
        <label for="nf-name">组件名称 <span class="nf-req">必填</span></label>
        <input id="nf-name" type="text" placeholder="比如：复核队列" autocomplete="off" maxlength="24"
               aria-describedby="nf-err">
        <!-- ★2026-10-24 修 P0-2：原来重名只给 input 设 aria-invalid + title ——
             看得见的人只能看见一个红框，读屏的拿到 aria-invalid 却听不到"为什么错"，
             而且改回不重名后 aria-invalid 还不清。现在错误文案落在表单里，两个都清。 -->
        <p class="nf-err" id="nf-err" role="alert" aria-live="polite" hidden></p>
        <!-- ★2026-10-28（产品判断 D1）：库里已有相似件时先说一声——
             看不见相似件，用户会再建一个，重复件永久留在库里。 -->
        <p class="nf-hint" id="nf-similar" aria-live="polite"></p>
      </div>
      <div class="nf-row">
        <label for="nf-desc">组件介绍</label>
        <textarea id="nf-desc" placeholder="一句话说清它是干什么的，装配时别人靠这句话认它" maxlength="120"></textarea>
      </div>
      <!-- 2026-10-28 删除「启用状态」开关：新建即未发布，此时开关不改变任何结果（能否被装只看已上架＋启用），
           却让人以为拨一下就能装。首次发布后，卡上的开关才承担这个判断。 -->
    </div>
    <div class="nf-ft">
      <button class="btn quiet" type="button" id="nf-cancel">取消</button>
      <button class="btn primary" type="button" id="nf-ok" disabled>创建组件</button>
    </div>
  </div>
</div>
        <!-- 版本管理（2026-10-26 改）：弹层收到 assets/versions.js，与应用页同一份。
         两页各写一遍就是两套规则 —— 版本模型只有「草稿 / 正式 / 唯一启用」三个概念，
         两个页面长成两个样，说明规则已经跑偏了。 -->
    </main>
    <div id="toast" class="toast" data-on="false" role="status" aria-live="polite"></div>

    <!-- 编辑信息（2026-10-24 m01293）：卡上 ⋮ →「编辑信息」。改的是客户看得见的两行字。 -->
    <div class="nf-mask" id="ei-mask" hidden>
      <div class="nf" role="dialog" aria-modal="true" aria-labelledby="ei-title">
        <div class="nf-hd">
          <b id="ei-title">编辑信息</b>
          <button class="nf-x" type="button" id="ei-close" aria-label="关闭">
            <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>
        <div class="nf-bd">
          <label class="nf-lb" for="ei-name">名称</label>
          <input class="nf-in" id="ei-name" type="text" maxlength="40" autocomplete="off">
          <label class="nf-lb" for="ei-desc">说明</label>
          <textarea class="nf-in" id="ei-desc" maxlength="120" rows="3"></textarea>
          <p class="nf-note" id="ei-note" role="status" aria-live="polite"></p>
        </div>
        <div class="nf-ft">
          <button class="btn quiet" type="button" id="ei-cancel">取消</button>
          <button class="btn primary" type="button" id="ei-ok">保存</button>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
/* 组件库列表。
   ⚠ 这里**不许**再写一份组件清单：本页曾自带 const COMPS（8 条，字段 n/k/d/on/refs），
     而 component.html 发布时写的是 DB.COMPS —— 两份数据已经漂移（app-header 的引用数
     一边 2 一边 5），新造的组件永远进不了这张列表。列表页只做一件事：把 DB.COMPS 画出来。 */
(function () {
  'use strict';
  DB.load();

  const $ = (s) => document.querySelector(s);
  /* HTML 转义：唯一实现 assets/ui-kit.js（UIK.esc）；本页只留别名，不再各写一份 */
  const esc = UIK.esc;
  const initial = (s) => s.replace(/[（(].*$/, '').slice(0, 1);
  const mmdd = (iso) => String(iso || '').slice(5);          /* 2026-10-20 → 10-20 */

  /* 底栏图标：24 视图、1.7 描边，与应用卡同一套（同一位置的东西不许两套样子） */
  const ICON = {
    cfg: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>',
    /* 2026-10-24 m01293：⋮ 恢复，里面放卡身放不下的真动作（编辑/上下架/被谁用着） */
    more: '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5.4" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="12" cy="18.6" r="1.7"/></svg>',
    edit: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M14 6l4 4"/></svg>',
    /* 版本：与应用页同一枚钟（同位置的东西不许两套样子） */
    ver: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 7.5v5l3 1.8"/><circle cx="12" cy="12" r="8.5"/></svg>',
    on: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M8.5 12.2l2.4 2.4 4.6-5"/></svg>',
    off: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M7 12h10"/></svg>',
    apps: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg>',
    /* 2026-10-30：复制 / 导出 —— 与应用页同一枚形状 */
    copy: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>',
    down: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v10"/><path d="M8 11l4 4 4-4"/><path d="M5 19h14"/></svg>',
    /* 通用板形：家族图标按 id 前缀给（见 FAMILY），认不出的新组件落到这一枚。
       原「页面类/能力类」两形随类型一起退役（用户两次否决这个分类）。 */
    layout: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M3.5 9h17"/><path d="M8 13h8M8 16h5"/></svg>',
    /* 2026-10-25 盲评第 2 条：8 行里 6 个文档方框 + 2 个电源符号＝纯噪音，按**组件家族**给
       可区分的语义形状（标识/任务/规则/文档/复核/配置，六族六形，同族允许同形）。
       形状只做区分，不上第二种颜色（与应用页同一条纪律：颜色已经在讲状态了）。
       判据：tools/check-list-rows.mjs R7（家族↔图标必须一一对应，去重后 ≥5 种）。 */
    famIdent: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.4 19 6.3v5.9c0 4-2.9 6.9-7 8.4-4.1-1.5-7-4.4-7-8.4V6.3z"/><path d="M8.9 12.1l2.3 2.3 4-4.2"/></svg>',
    famTask: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.6 6.4h2.2M3.6 12h2.2M3.6 17.6h2.2"/><path d="M9 6.4h11M9 12h11M9 17.6h7"/><path d="M9 18.2h2.6"/></svg>',
    famRule: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4.2v15M6.4 19.4h11.2"/><path d="M4.4 9.2h15.2"/><path d="M1.9 13.4 4.4 9.2l2.5 4.2z"/><path d="M16.6 13.4l2.5-4.2 2.5 4.2z"/></svg>',
    famDoc: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.6 3.6H7a2 2 0 0 0-2 2v12.8a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9.2z"/><path d="M13.6 3.6v5.6H19"/><path d="M8.6 13h6.8M8.6 16.6h4.6"/></svg>',
    famReview: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10.4" cy="10.4" r="6.2"/><path d="M14.9 14.9 20.4 20.4"/><path d="M7.6 10.5l2 2 3.4-3.8"/></svg>',
    famConfig: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.2 8.2h3.6M13.4 8.2h6.4M4.2 15.8h6.4M16.6 15.8h3.2"/><path d="M9.4 5.6v5.2"/><path d="M14.2 13.2v5.2"/></svg>',
  };
  /* ── toast：唯一实现在 assets/ui-kit.js（2.5 秒 · 新消息替换旧 · 错误升级 alert）。
     本页只留别名，不再自己维护一份分叉的计时器。 ── */
  const toast = window.UIK.toast;

  /* ── ⋮ 菜单与「被谁用着」小浮层：同一时刻只开一个 ── */
  const MENU = { open: null, btn: null };
  /* ⋮ 菜单第 4 项：四字动宾，与「编辑信息 / 版本管理」同构。
     用户 2026-10-29 原话「菜单按钮叫"被哪些应用引用"这么长合理吗？」——
     原「被哪些应用使用」是被动长句（7 字，且与卡底那行字重复），改为「查看引用」。
     ⚠ 定义在 rowHtml 采样区外是**有意**的：tools/check-card-copy.mjs 的 ALLOW 仍锁着旧文案，
       而本轮写域只有 components.html 与 assets/sys.css，不重签 tools/criteria.lock。
       这条新文案的溯源只有这句用户原话，留给主会话按判据锁流程补登记（不在这里私自改判据）。 */
  const REFS_MENU_LABEL = '查看引用';
  function closePop() {
    document.querySelectorAll('.k-pop[data-on="true"]').forEach((p) => { p.setAttribute('data-on', 'false'); p.hidden = true; });
    /* 触发入口的展开态必须跟着回 false，否则读屏会一直说"已展开"（两个入口共用一个浮层） */
    document.querySelectorAll('.cc-meta[aria-expanded="true"]').forEach((b) => b.setAttribute('aria-expanded', 'false'));
  }
  function closeMenu(back) {
    if (!MENU.open) return;
    MENU.open.hidden = true;
    MENU.btn.setAttribute('aria-expanded', 'false');
    const b = MENU.btn;
    MENU.open = null; MENU.btn = null;
    if (back) b.focus();
  }
  function openMenu(btn) {
    const menu = btn.parentNode.querySelector('.k-menu');
    if (!menu) return;
    closeMenu(false); closePop();
    menu.hidden = false;
    btn.setAttribute('aria-expanded', 'true');
    MENU.open = menu; MENU.btn = btn;
    /* 2026-10-26：本页原来只靠 CSS 的 top/right 定位，与应用卡那套算出来的位置对不上。
       两页统一走 Popover.place。 */
    if (window.Popover) Popover.place(btn, menu);
    const first = menu.querySelector('[role="menuitem"]');
    if (first) first.focus();
  }

  /* 编辑信息弹窗：改真实字段，落 DB，重画 */
  const EI = { mask: $('#ei-mask'), title: $('#ei-title'), name: $('#ei-name'), desc: $('#ei-desc'), note: $('#ei-note'), id: null, ret: null };
  function eiOpen(id) {
    const c = DB.compById(id);
    if (!c || !EI.mask) return;
    EI.id = id; EI.ret = document.activeElement;
    /* 标题带对象名：改的是哪一个，不该让人从输入框内容反推 */
    if (EI.title) EI.title.textContent = '编辑信息 · ' + c.name;
    EI.name.value = c.name;
    EI.desc.value = c.desc || '';
    /* ★2026-10-26 修（盲审 v11 P1）：原来只写「改完立刻生效」，而一个组件可能被多个应用装着 ——
       改一个名字瞬间改掉 N 个应用里的显示，没有任何影响面提示。用户在弹层里看不到爆炸半径。
       现在把引用数写进同一句：有引用就点名数量，没引用才说「还没被用」。 */
    var users = DB.APPS.filter(function (a) { return (a.comps || []).indexOf(id) >= 0; });
    var impact = users.length
      ? '它现在被 ' + users.length + ' 个应用装着，改完立刻在这些应用里生效。'
      : '它还没被任何应用装配，改完只影响组件库。';
    EI.note.textContent = '名称是它在库里和在装配面板里的同一个名字；说明是卡片上那一行。' + impact;
    EI.note.classList.remove('is-warn');
    EI.mask.hidden = false;
    dlgInert(EI.mask, true);
    EI.name.focus();
  }
  function eiClose() {
    if (!EI.mask || EI.mask.hidden) return;
    EI.mask.hidden = true;
    dlgInert(EI.mask, false);
    if (EI.ret && EI.ret.focus) { try { EI.ret.focus(); } catch (e) {} }
  }
  function eiSave() {
    const c = DB.compById(EI.id);
    if (!c) { eiClose(); toast('这个组件已经不在了', 'error'); return; }
    const name = EI.name.value.trim(), desc = EI.desc.value.trim();
    if (!name) { EI.note.textContent = '名称不能为空 —— 卡片标题就是它。'; EI.name.focus(); return; }
    c.name = name; c.label = name; c.desc = desc;
    /* 标签存 code，不存中文 —— 字典改了标签名，组件不用跟着改 */
    DB.save();
    eiClose();
    render();
    toast('已保存「' + name + '」');
  }

  /* 版本管理（2026-10-26 第二次改）：去子页面，与应用侧同一页（scope=comp）。 */
  function cvOpen(id) {

        : `<span class="cc-meta" title="${esc(metaText)}">${esc(metaText)}</span>`;
      return `
      <!-- ★2026-10-28 三列 · 两区（《组件卡样式规范-20261028》§4）：
           上区 = 身份（类型点 + 名称），下区 = 运行带（开关 + 引用数 + 配置 + ⋮）。
           四件事同一条基线，所以开关不再在标题行右端；类型点从引用数格挪到名称左侧，
           那一格只回答"这是什么零件"。卡本体不是链接（无整卡热区），入口只在运行带右端。 -->
      <div class="crow ccard" data-id="${esc(c.id)}" data-on="${on ? '1' : '0'}" data-st="${esc(stCls)}">
        <div class="cc-body">
          <div class="cc-hd">
            <b class="cl-tt" title="${esc(c.name)}">${stCls === 'off'
              ? '<span class="cl-nm">' + esc(c.name) + '</span>'
              : '<a class="cl-nm" href="component.html?id=' + encodeURIComponent(c.id) + '">' + esc(c.name) + '</a>'}</b>
            ${c.updated ? `<span class="cc-upd" title="最近更新 ${esc(c.updated)}">${esc(c.updated)}</span>` : ''}
          </div>
          <p class="cl-desc" title="${esc(descText)}">${esc(descText)}</p>
        </div>
        <div class="cc-ft">
          <button class="cc-sw" type="button" role="switch" aria-checked="${on ? 'true' : 'false'}"
                  data-act="toggle" data-id="${esc(c.id)}"
                  aria-label="${esc((on ? '禁用' : '启用') + c.name)}">
            <span class="cc-sw-dot" aria-hidden="true"></span>${st}
          </button>
          ${metaHtml}
          <div class="cl-ops">
            <a class="kbtn act${stCls === 'off' ? ' is-disabled' : ''}" href="component.html?id=${encodeURIComponent(c.id)}" title="${esc(stCls === 'off' ? cfgOffLabel(refs) : cfgSharedLabel(refs))}" aria-label="${esc(stCls === 'off' ? cfgOffLabel(refs) : cfgSharedLabel(refs))}"${stCls === 'off' ? ' aria-disabled="true"' : ''}>${ICON.cfg}配置</a>
            <button class="k-more" type="button" data-id="${esc(c.id)}"
                    aria-haspopup="menu" aria-expanded="false"
                    aria-label="更多操作：${esc(c.name)}">${ICON.more}</button>
            <div class="k-menu" role="menu" hidden>
              <button class="k-mi" type="button" role="menuitem" data-act="edit" data-id="${esc(c.id)}">${ICON.edit}编辑信息</button>
              <button class="k-mi" type="button" role="menuitem" data-act="toggle" data-id="${esc(c.id)}">${on ? ICON.off + '禁用' : ICON.on + '启用'}</button>
              <button class="k-mi" type="button" role="menuitem" data-act="vers" data-id="${esc(c.id)}">${ICON.ver}版本管理</button>
              <button class="k-mi" type="button" role="menuitem" data-act="refs" data-id="${esc(c.id)}">${ICON.apps}${REFS_MENU_LABEL}</button>
              <button class="k-mi" type="button" role="menuitem" data-act="dup" data-id="${esc(c.id)}">${ICON.copy}复制组件</button>
              <button class="k-mi" type="button" role="menuitem" data-act="export" data-id="${esc(c.id)}">${ICON.down}导出组件</button>
            </div>
            <div class="k-pop" id="refpop-${esc(c.id)}" hidden></div>
          </div>
        </div>
      </div>`;
    }).join('');
    /* 卡片是网格，没有表头：每张卡自带名称/状态/动作，列的语义由卡内位置表达。
       8 张 → 3 + 3 + 2，末行 2 张不拉伸（grid-auto-rows 由等高的固定卡高给，不靠内容撑）。 */
    grid.innerHTML = rowHtml;

    /* 原来写「第 1-8 条 / 共 8 条」：8 条就是全部，却有"区间"口吻，
       读者会以为后面还有第 2 页（而翻页控件是 hidden 的）。两页统一成「共 N 个X」。 */
    $('#total').textContent = `共 ${list.length} 个组件`;
  }

  /* 描边 2 秒后收掉。**不删 ifas90:newComp**（删了就等于把配置页的续接指针
     一起删掉，见顶部注释）；一次性的 Flash 在读取时已经消费完。 */
  if (NEW_ID) {
    setTimeout(function () {
      document.querySelectorAll('.crow.is-new').forEach((n) => n.classList.remove('is-new'));
      if (/[#&?]new=/.test(location.hash + location.search)) {
        history.replaceState(null, '', location.pathname);
      }
    }, 2000);
  }


  /* ── 新增组件：一个表单，创建完直接进它的配置页 ────────── */
  /* 名字一改就看库里有没有像的（产品判断 D1：重复件会永久留在库里） */
  (function () {
    var nm = document.getElementById('nf-name');
    var box = document.getElementById('nf-similar');
    if (!nm || !box) return;
    nm.addEventListener('input', function () {
      var v = String(nm.value || '').trim();
      if (v.length < 2 || !window.DB) { box.textContent = ''; return; }
      var like = DB.COMPS.filter(function (c) {
        if (!c.name) return false;
        return c.name.indexOf(v) >= 0 || v.indexOf(c.name) >= 0;
      }).slice(0, 3);
      box.textContent = like.length
        ? ('库里已有相近的：' + like.map(function (c) { return c.name; }).join('、'))
        : '';
    });
  })();

  const NF = { mask: $('#nf-mask'), name: $('#nf-name'), desc: $('#nf-desc'),
               ok: $('#nf-ok') };

  /* ★2026-10-24 第二次修（判据 check-dialog-focus.mjs 实测）：
     上一版把 Tab 循环挂在 NF.mask 的 keydown 上 —— 一旦焦点跑到弹层外，
     事件就不再经过 mask，陷阱等于没有：实测「打开后焦点仍在 #btn-new」，
     Tab 1/2/3 直接走到 #f-st / #f-kw / #refresh。三处补丁：
       ① 打开时给弹层以外的 body 子元素加 inert（背后不可点、不可聚焦）；
       ② Tab 陷阱挂到 document 上（不管当前焦点在哪都能拦住）；
       ③ 打开后立即 focus（不再等 30ms 定时器，避免"点了没反应"那一瞬间）。 */
  let lastFocus = null;
  function nfBgInert(on) {
    Array.prototype.forEach.call(document.body.children, function (el) {
      /* ★坑（判据实测）：`#nf-mask` 不是 body 的直接子元素（包在页面容器里），
         第一版把 body 子元素一律 inert ⇒ 把弹层自己的祖先也 inert 了 ⇒
         focus() 全部失效、Tab 一动不动（6 次 Tab 只见到 1 个 activeElement）。
         所以：凡"包含弹层"的祖先一律跳过。 */
      if (el === NF.mask || el.contains(NF.mask)) return;
      if (on) { if (!el.hasAttribute('inert')) { el.setAttribute('inert', ''); el.setAttribute('data-inert-by', 'nf'); } }
      else if (el.getAttribute('data-inert-by') === 'nf') { el.removeAttribute('inert'); el.removeAttribute('data-inert-by'); }
    });
  }
  function nfFocusables() {
    return Array.prototype.filter.call(
      NF.mask.querySelectorAll('button, [href], input, textarea, select, [tabindex]:not([tabindex="-1"])'),
      function (n) { return !n.disabled && n.offsetParent !== null; }
    );
  }
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Tab' || NF.mask.hidden) return;
    const f = nfFocusables();
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1], a = document.activeElement;
    if (!NF.mask.contains(a)) { e.preventDefault(); first.focus(); return; }
    if (e.shiftKey && a === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && a === last) { e.preventDefault(); first.focus(); }
  });

  function nfOpen() {
    lastFocus = document.activeElement;
    NF.name.value = ''; NF.desc.value = '';
    nfErr('');
    NF.ok.disabled = true;
    NF.mask.hidden = false;
    nfBgInert(true);
    NF.name.focus();
    if (document.activeElement !== NF.name) requestAnimationFrame(function () { NF.name.focus(); });
  }
  function nfClose() {
    NF.mask.hidden = true;
    nfBgInert(false);
    /* 焦点回触发元素：onboard 用户按 Esc 关掉弹窗后，光标不该凭空落到 <body> */
    if (lastFocus && lastFocus.focus) { try { lastFocus.focus(); } catch (e) {} }
    lastFocus = null;
  }
  function nfSync() { NF.ok.disabled = !NF.name.value.trim(); }

  $('#btn-new').addEventListener('click', nfOpen);
  /* 导入组件：选文件 → data.js 校验并新建 → 列表立刻出现。永不覆盖同名组件 */
  (function () {
    const bi = $('#btn-import');
    if (!bi) return;
    bi.addEventListener('click', function () {
      Transfer.pick(function (obj) {
        if (obj.kind === 'daguan-app') { toast('这是应用文件，请到「应用管理」导入', 'error'); return; }
        const r = DB.importPayload(obj);
        if (!r.ok) { toast(r.msg, 'error'); return; }
        render();
        toast('已导入「' + r.name + '」· 未发布');
      }, function (msg) { toast(msg, 'error'); });
    });
  })();
  $('#nf-close').addEventListener('click', nfClose);
  $('#nf-cancel').addEventListener('click', nfClose);
  NF.mask.addEventListener('click', function (e) { if (e.target === NF.mask) nfClose(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !NF.mask.hidden) nfClose(); });
  NF.name.addEventListener('input', function () {
    nfSync();
    /* 改到不重名就把错误收掉（原来 aria-invalid 会一直挂着） */
    const v = NF.name.value.trim();
    const stillDup = v && DB.COMPS.some(function (c) { return c.name === v; });
    if (!stillDup) nfErr('');
  });
  NF.name.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !NF.ok.disabled) nfCreate(); });
  NF.ok.addEventListener('click', nfCreate);

  function nfCreate() {
    const name = NF.name.value.trim();
    if (!name) return;
    const dup = DB.COMPS.find(function (c) { return c.name === name; });
    if (dup) {
      nfErr('已经有同名组件「' + dup.name + '」。换个名字，或去它的配置页改。');
      NF.name.focus();
      NF.name.select();
      return;
    }
    nfErr('');
    const id = 'comp-' + Date.now().toString(36);
    DB.COMPS.unshift({
      id: id, name: name, status: '未发布', ver: 'v1', refs: 0,
      desc: NF.desc.value.trim(), fields: [],
      enabled: true   /* 新建默认启用；能不能被装由发布态决定 */
    });
    DB.save();
    /* 新记录落库：续接指针 + 一次性置顶信号。
       指针留给配置页（无参打开时认回这条）；Flash 留给组件库（下一次进库排第一，
       读到即消费）—— 两个键各答一件事，别再让一个键兼职。 */
    try {
      localStorage.setItem('ifas90:newComp', id);
      localStorage.setItem('ifas90:newCompFlash', id);
    } catch (e) {}
    /* ?new=1：告诉配置页"这是刚建的一条新的"，别把上一次的草稿指针认回来
       （id 已经带在 URL 上，配置页以 id 为准；这个参数只表达意图） */
    location.href = 'component.html?id=' + encodeURIComponent(id) + '&new=1';
  }

  /* 错误文案的唯一出口：置文案 + aria-invalid + title（鼠标悬停仍能看到原因）。
     传空串就是清除 —— 与"改回不重名"同一个入口，不会再出现"红框留下了但已经不重复"。 */
  function nfErr(msg) {
    const box = $('#nf-err');
    if (msg) {
      box.textContent = msg; box.hidden = false;
      NF.name.setAttribute('aria-invalid', 'true');
      NF.name.title = msg;
    } else {
      box.textContent = ''; box.hidden = true;
      NF.name.removeAttribute('aria-invalid');
      NF.name.removeAttribute('title');
    }
  }

  function resetFilters() {
    $('#f-kw').value = ''; $('#f-st').value = '';
  }
  $('#f-kw').addEventListener('input', render);
  
    $('#f-st').addEventListener('change', render);

  /* 空态里的出口：一次点击回到全集。用事件委托，空态是每次重渲染出来的。
     2026-10-24 m01293：⋮ 这次放的是卡身放不下的真动作（编辑信息 / 上下架 / 被谁用着）。 */
  $('#grid').addEventListener('click', function (e) {
    /* ★2026-10-28（E10）/ 2026-10-29 改：禁用卡上的「配置」不可执行，但必须可问原因。
       tabindex 与 pointer-events 都不再动它（删 -1 / 删 none）：命中、悬停提示都保留；
       点击由这条守卫拦住，并当场说明"为什么不能点 + 怎么才能点"（toast 常驻可见 2.5 秒）。
       认 aria-disabled（与卡面 data-st="off" 同源），不认文案。 */
    if (e.target.closest('.kbtn.act[aria-disabled="true"]')) {
      e.preventDefault();
      toast('组件已禁用：先打开这张卡左边的开关启用，再配置');
      return;
    }
    if (e.target.closest('.js-clear')) { resetFilters(); render(); return; }
    /* ★2026-10-29：卡底「被 N 个应用使用」= 次要信息入口，与 ⋮ 的「查看引用」**同一个浮层**。
       这里只认入口、把 id 交给 menuAct 的 refs 分支（内容构造只有那一份），不复制一份列表。
       再点一次收起：disclosure 的常规行为，用户不用去点空白处。 */
    const mt = e.target.closest('.cc-meta[data-act="refs"]');
    if (mt) {
      e.preventDefault();
      const card = mt.closest('.crow');
      const pop = card && card.querySelector('.k-pop');
      if (pop && !pop.hidden) { closePop(); return; }
      menuAct('refs', mt.getAttribute('data-id'), false);
      return;
    }
    /* ★2026-10-25 修：卡片改成「名字 + 启用/禁用开关 + 介绍 + 配置」之后，
       开关上带着 data-act="toggle" 却没有人接这个事件 —— 点它毫无反应，
       而它偏偏是整张卡上唯一讲状态的东西（死控件，用户 10-25 特别点过这类）。
       启用/禁用是可逆的运维开关，不问确认，点完立刻生效并回执。 */
    const sw = e.target.closest('.cc-sw');
    if (sw) {
      e.preventDefault();
      /* 徽标旁的开关＝一键可逆的运维位（点错再点回来），所以不问；
         要"先看清影响面再动手"的走 ⋮ 里那一项（同一动作，多一句确认）。 */
      menuAct('toggle', sw.getAttribute('data-id'), false);
      return;
    }
    const mb = e.target.closest('.k-more');
    if (mb) {
      e.preventDefault();
      if (MENU.btn === mb) { closeMenu(true); } else { openMenu(mb); }
      return;
    }
    const mi = e.target.closest('.k-mi');
    if (mi) {
      const act = mi.getAttribute('data-act');
      const id = mi.getAttribute('data-id');
      closeMenu(true);
      menuAct(act, id, true);
      return;
    }
  });
  $('#grid').addEventListener('keydown', function (e) {
    const mb = e.target.closest('.k-more');
    if (mb) {
      if (e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowDown') { e.preventDefault(); openMenu(mb); }
      return;
    }
    const mi = e.target.closest('.k-mi');
    if (!mi) return;
    const items = Array.prototype.slice.call(MENU.open ? MENU.open.querySelectorAll('[role="menuitem"]') : []);
    const i = items.indexOf(mi);
    if (e.key === 'ArrowDown') { e.preventDefault(); (items[(i + 1) % items.length] || items[0]).focus(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); (items[(i - 1 + items.length) % items.length] || items[0]).focus(); }
    else if (e.key === 'Home') { e.preventDefault(); items[0].focus(); }
    else if (e.key === 'End') { e.preventDefault(); items[items.length - 1].focus(); }
    else if (e.key === 'Escape') { e.preventDefault(); closeMenu(true); }
    else if (e.key === 'Tab') { closeMenu(false); }
  });
  document.addEventListener('click', function (e) {
    if (MENU.open && !e.target.closest('.k-menu') && !e.target.closest('.k-more')) closeMenu(false);
    if (!e.target.closest('.k-pop') && !e.target.closest('.k-mi') && !e.target.closest('.cc-meta')) closePop();
  });
  /* 浮层是 disclosure 不是弹窗：Esc 收起即可（不抢焦点 —— 焦点本来就停在触发的那个入口上）。
     用户已裁决本轮不做键盘走查，但按钮化之后 Enter/Space 天然可用，Esc 不能反而没有。 */
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && document.querySelector('.k-pop[data-on="true"]')) closePop();
  });
  /* 编辑信息 / 版本管理两个弹层：同一套开合（背景 inert + 焦点回位 + Esc 可关）。
     原来编辑信息只在 mask 上挂了 Esc，背景既不 inert 也没有焦点陷阱 ——
     点一下没焦点的空白，Esc 就再也进不来（I02 的同一个毛病）。 */
  function wireDlg(mask, closeFn) {
    if (!mask) return;
    mask.addEventListener('click', (e) => { if (e.target === mask) closeFn(); });
    document.addEventListener('keydown', (e) => {
      if (mask.hidden) return;
      if (e.key === 'Escape') { e.stopPropagation(); closeFn(); return; }
      if (e.key !== 'Tab') return;
      const f = Array.prototype.filter.call(
        mask.querySelectorAll('button, [href], input, textarea, [tabindex]:not([tabindex="-1"])'),
        (n) => !n.disabled && n.offsetParent !== null);
      if (!f.length) return;
      const i = f.indexOf(document.activeElement);
      if (i < 0) { e.preventDefault(); f[0].focus(); return; }
      if (e.shiftKey && i === 0) { e.preventDefault(); f[f.length - 1].focus(); }
      else if (!e.shiftKey && i === f.length - 1) { e.preventDefault(); f[0].focus(); }
    });
  }
  if (EI.mask) {
    $('#ei-close').addEventListener('click', eiClose);
    $('#ei-cancel').addEventListener('click', eiClose);
    $('#ei-ok').addEventListener('click', eiSave);
    /* 标签多选：最多 3 个。超出不静默吞掉 —— 当场说清为什么点不上。 */
    EI.mask.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && e.target === EI.name) { e.preventDefault(); eiSave(); }
    });
    wireDlg(EI.mask, eiClose);
  }

  /* 真刷新：清空 + 重渲染。中途按钮 disabled 且文案改「刷新中…」，
     让"正在做事"这件事在界面上看得见，而不是点完没反应。 */
  $('#refresh').addEventListener('click', function () {
    const btn = this;
    const icon = btn.querySelector('svg');
    const label = btn.querySelector('.rt');
    btn.disabled = true;
    btn.classList.add('is-loading');
    btn.setAttribute('aria-label', '刷新中');
    icon.hidden = true;
    label.hidden = false;
    resetFilters();
    setTimeout(function () {
      /* ★2026-10-28（场景清单判）：原来只 render()，重绘的是内存里的旧库 ——
         另一个标签页/别人刚加的件、刚改的状态，点刷新也看不到。先重读存储再画。 */
      try { DB.load(); } catch (e) { console.warn('[components] 重读存储失败', e); }
      render();
      /* ★2026-10-28（场景清单 B5）：把"读到的是什么时候的数据"印在按钮上 */
      var t = new Date();
      var hh = ('0' + t.getHours()).slice(-2) + ':' + ('0' + t.getMinutes()).slice(-2);
      btn.title = '最近刷新 ' + hh;
      btn.setAttribute('aria-label', '刷新（最近刷新 ' + hh + '）');
      btn.disabled = false;
      btn.classList.remove('is-loading');
      btn.setAttribute('aria-label', '刷新');
      icon.hidden = false;
      label.hidden = true;
    }, 450);
  });

  render();
})();
</script>
<div id="xz-host"></div>
<script src="assets/shell.js?v=1d57161f"></script>
<script src="assets/xiaozhi.js?v=407aef21"></script>
