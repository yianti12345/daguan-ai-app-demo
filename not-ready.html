<script src="assets/shell.js?v=fb699fab"></script>
<script src="assets/ui-kit.js?v=17f759c1"></script>
<script>
  /* 页名来自 ?p= —— 五个子页共用一个落地页，标题与 <title> 都跟着它变。
     取值只做文本注入（textContent），不拼 HTML：URL 是外面来的。 */
  (function () {
    var p = '';
    try { p = new URLSearchParams(location.search).get('p') || ''; } catch (e) {}
    if (!p) p = '系统设置';
    var t = document.getElementById('nr-title');
    var n = document.getElementById('nr-name');
    var h = document.getElementById('nr-h1');
    if (t) t.textContent = p + ' · 未接入';
    if (n) n.textContent = p;
    if (h) h.textContent = p;
    document.title = p + '-未接入';
  })();
</script>
