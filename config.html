<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>基础配置</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23587FFF'/%3E%3Crect x='8' y='9' width='16' height='3' rx='1.5' fill='white'/%3E%3Crect x='8' y='15' width='11' height='3' rx='1.5' fill='white' opacity='.75'/%3E%3Crect x='8' y='21' width='7' height='3' rx='1.5' fill='white' opacity='.5'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/tokens.css?v=8c85267c">
<link rel="stylesheet" href="assets/sys.css?v=fdd105a7">
<link rel="stylesheet" href="assets/xiaozhi.css?v=1965c88b">
<style>
/* 只作用于本页，取值全来自令牌。 */
.page-hd{display:flex;align-items:flex-start;gap:var(--space-12);margin:0 0 var(--space-16)}
.page-hd h1{margin:0;font-size:var(--font-size-display);font-weight:600;line-height:var(--leading-display);color:var(--color-text-primary)}
.page-hd .ops{margin-left:auto;display:flex;align-items:center;gap:var(--space-8)}
.cfg-sec{margin:0 0 var(--space-24)}
.cfg-sec-hd{display:flex;align-items:baseline;gap:var(--space-8);margin:0 0 var(--space-12)}
.cfg-sec-hd b{font-size:var(--font-size-heading);font-weight:600;color:var(--color-text-primary)}
.cfg-sec-hd span{font-size:var(--font-size-caption);color:var(--color-text-tertiary)}
/* 一组设置项，不要铺满 1000px 的整行——右边空一大片会看成"表格缺列" */
.scene{display:flex;align-items:center;gap:var(--space-32);max-width:720px;padding:var(--space-12) 0;border-bottom:1px solid var(--color-border-hairline)}
.scene:last-child{border-bottom:0}
.scene .scene-t{flex:0 0 auto;min-width:240px}
.scene .scene-sel{flex:0 0 240px}
.scene b{font-size:var(--font-size-body);font-weight:500;color:var(--color-text-primary)}
.scene p{margin:2px 0 0;font-size:var(--font-size-caption);color:var(--color-text-tertiary)}
.m-name{color:var(--color-text-primary)}
.m-dim{color:var(--color-text-tertiary)}
.m-ops{display:flex;align-items:center;gap:var(--space-12);justify-content:flex-end}
.m-op{height:24px;padding:0;border:0;background:none;font-family:inherit;font-size:var(--font-size-body);color:var(--color-brand-ink);cursor:pointer;white-space:nowrap}
.m-op:hover{text-decoration:underline}
.m-op.is-danger{color:var(--color-danger)}
.m-pg{margin-left:auto;color:var(--color-text-tertiary)}
.m-form{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-12) var(--space-16)}
.m-form label{display:flex;flex-direction:column;gap:var(--space-8);font-size:var(--font-size-caption);color:var(--color-text-secondary)}
.m-form input,.m-form select{height:32px;border:1px solid var(--color-border-control);border-radius:var(--radius-control);padding:0 var(--space-12);font-family:inherit;font-size:var(--font-size-body);color:var(--color-text-primary);background:var(--surface-page)}
.m-form input:focus,.m-form select:focus{outline:2px solid var(--color-brand);outline-offset:-1px;border-color:var(--color-brand)}
.m-form .wide{grid-column:1 / -1}
.m-sp{flex:1 1 auto}
</style>
  <meta name="robots" content="noindex,nofollow">
</head>
<body>

<div class="app">
  <nav class="sider" data-active="cfg-base"></nav>
  <div class="workspace">
    <header class="hdr">
      <nav class="crumb">
        <b>配置管理</b>
        <span class="sep" aria-hidden="true"><svg aria-hidden="true" viewBox="0 0 14 14" fill="currentColor"><path d="M4.396 2.146a.5.5 0 0 0-.057.638l.057.07L8.543 7l-4.147 4.146a.5.5 0 0 0-.057.638l.057.07a.5.5 0 0 0 .638.057l.07-.057 4.5-4.5a.5.5 0 0 0 .057-.638l-.057-.07-4.5-4.5a.5.5 0 0 0-.708 0Z"/></svg></span>
        <b>基础配置</b>
      </nav>
      <div class="me"><span>admin</span><u>ad</u></div>
    </header>

    <main class="main">
      <h1 class="sr-only">基础配置</h1>

      <div class="cfg-bar">
        <button type="button" class="btn ghost" id="act-new">新建模型</button>
        <button type="button" class="btn primary" id="act-save" disabled>保存</button>
      </div>

      <section class="cfg-sec" aria-labelledby="sec-scene">
        <div class="cfg-sec-hd"><b id="sec-scene">对话模型</b></div>
        <div id="scenes"></div>
      </section>

      <section class="cfg-sec" aria-labelledby="sec-model">
        <div class="cfg-sec-hd"><b id="sec-model">模型清单</b></div>
      <!-- ★2026-11-09：按类型筛选。计数为 0 的类型不渲染（真源那个「视觉(0)」是纯噪音）。 -->
      <div class="mtabs" id="mtabs" role="tablist" aria-label="按类型筛选模型"></div>
        <div class="cfg-table gtable">
          <div class="gtable-head" id="head" aria-hidden="true"></div>
          <div class="gtable-body" id="list" role="list" aria-label="模型列表"></div>
          <div class="gtable-foot"><span id="total"></span><span class="m-pg">15 条/页</span></div>
        </div>
      </section>
      
    </main>
    <div id="toast" class="toast" data-on="false" role="status" aria-live="polite"></div>
  </div>
</div>

<div class="nf-mask" id="dlg" hidden>
  <div class="nf" role="dialog" aria-modal="true" aria-labelledby="dlg-t">
    <div class="nf-hd">
      <b id="dlg-t">新建模型</b>
      <button type="button" class="icon-btn" id="dlg-x" aria-label="关闭">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="nf-bd">
      <div class="m-form" id="m-form">
        <!-- 类型是第一项：它决定下面出现哪些字段（2026-11-09） -->
        <div class="fld">
          <span class="f-hint">模型类型</span>
          <div class="chips" id="k-chips" role="radiogroup" aria-label="模型类型"></div>
        </div>
        <div class="fld">
          <span class="f-hint">模型来源</span>
          <div class="chips" id="s-chips" role="radiogroup" aria-label="模型来源"></div>
        </div>
        <label for="f-name"><span>模型标识</span><span class="f-hint">调用时用的真实模型名，如 gpt-4o</span><input id="f-name" placeholder="例如 deepseek-flash"></label>
        <label for="f-label"><span>显示名</span><span class="f-hint">列表里给人看的，只影响展示</span><input id="f-label" placeholder="例如 DeepSeek Flash"></label>
        <label for="f-vendor"><span>模型厂商</span><input id="f-vendor" list="vendor-list" placeholder="选或填，例如 DeepSeek"></label>
        <datalist id="vendor-list"><option value="DeepSeek"></option><option value="阿里云"></option><option value="OpenAI"></option><option value="自建"></option></datalist>
        <label for="f-url"><span>API 地址</span><input id="f-url" placeholder="https://api.example.com/v1"></label>
        <label for="f-key"><span>API Key</span><input id="f-key" type="password" placeholder="sk-..."></label>
        <label for="f-temp" data-need="chat"><span>温度</span><input id="f-temp" type="number" step="0.1" min="0" max="2" value="0.2"></label>
        <label for="f-react" data-need="chat"><span>最大迭代次数</span><input id="f-react" type="number" min="0" value="10"></label>
        <label for="f-out" data-need="chat"><span>单次输出上限</span><input id="f-out" type="number" min="0" value="32768"></label>
        <label for="f-ctx" data-need="chat embed rerank"><span>上下文窗口</span><input id="f-ctx" type="number" min="0" value="128000"></label>
        <label for="f-dim" data-need="embed"><span>向量维度</span><span class="f-hint">必须与索引一致，换模型要重建索引</span><input id="f-dim" type="number" min="0" placeholder="例如 1024"></label>
        <label for="f-topn" data-need="rerank"><span>候选数</span><input id="f-topn" type="number" min="1" placeholder="例如 10"></label>
        <label for="f-afmt" data-need="asr"><span>音频格式</span><span class="f-hint">允许上传的格式，逗号分隔</span><input id="f-afmt" placeholder="例如 mp3, wav"></label>
        <label for="f-vision" data-need="chat"><span>支持图片输入</span><select id="f-vision"><option value="0">不支持</option><option value="1">支持</option></select></label>
        <div class="fld">
          <button type="button" class="btn quiet" id="hd-add">+ 添加请求头（可选）</button>
          <div id="hd-list" class="hd-list"></div>
        </div>
      </div>
    </div>
    <div class="nf-ft">
      <!-- ★2026-11-09：测试连接在左下角，结果就在它右边。界面只有「连接成功／连接失败」两个词。 -->
      <button type="button" class="btn quiet" id="dlg-test" disabled>测试连接</button>
      <span class="rt" id="dlg-test-res" role="status" aria-live="polite"></span>
      <span class="m-sp"></span>
      <button type="button" class="btn ghost" id="dlg-cancel">取消</button>
      <button type="button" class="btn primary" id="dlg-save">保存</button>
    </div>
  </div>
</div>

<script src="assets/shell.js?v=fb699fab"></script>
<script src="assets/ui-kit.js?v=ca813031"></script>
<script src="assets/confirm.js?v=33f3cd5b"></script>
<script src="assets/spec.js?v=fa39c321"></script>
<script src="assets/list.js?v=cbb213a1"></script>
<script src="assets/capability.js?v=97016c40"></script>
<script src="assets/config.js?v=39c6e5f0"></script>
</body>
</html>
