<div class="app">
  <!-- 侧栏通高、logo 在它顶部；顶栏只在右侧 —— 与线上一致（骨架注释见 sys.css 开头） -->
  <nav class="sider" data-active="apps"></nav>
  <div class="workspace">
    <header class="hdr">
      <nav class="crumb">
        <b>AI 应用方案</b>
        <span class="sep" aria-hidden="true"><svg aria-hidden="true" viewBox="0 0 14 14" fill="currentColor"><path d="M4.396 2.146a.5.5 0 0 0-.057.638l.057.07L8.543 7l-4.147 4.146a.5.5 0 0 0-.057.638l.057.07a.5.5 0 0 0 .638.057l.07-.057 4.5-4.5a.5.5 0 0 0 .057-.638l-.057-.07-4.5-4.5a.5.5 0 0 0-.708 0Z"/></svg></span>
        <b>应用管理</b>
      </nav>
      <div class="me"><span>admin</span><u>ad</u></div>
    </header>
    <main class="main">
      <h1 class="sr-only">应用管理</h1>
      <!-- ★2026-10-24：删掉这里的大标题「应用管理」。
           面包屑已经是「AI 应用方案 › 应用管理」，同一屏写两遍同一句话是重复；
           而且组件库页没有这个 h1，两页并排看结构就不一致了（用户要的是 1:1 同一套）。
           .page-hd 的样式保留 —— 别的页还要用。 -->

      <!-- 被配置页退回时的一次性提示（?pick=1 没给 id / ?miss=1 id 查不到） -->
      <div class="notice" id="notice" role="status" aria-live="polite" hidden></div>

      <div class="bar bar-main">
        <!-- ★2026-10-24 修 P0-3：原来这里是 <a href="app.html">——不带 id，
             app.html 回落到列表第一条，于是「新建应用」= 打开别人的应用，改完保存改错人。
             现在是一颗真按钮：建草稿 → 带新 id 进配置页。 -->
        <button class="btn primary" id="btn-new" type="button">
          <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          新建应用
        </button>
        <!-- 2026-10-30：导入是一个"从文件新建"的入口，与新建同级、权重更低（次要按钮） -->
        <button class="btn" id="btn-import" type="button">导入应用</button>
        <div class="right">
          <!-- 2026-10-31（操作缺口）：列表原来只有"库里的顺序"（DB.APPS 数组序，新件 unshift 到最前），
               想知道"最近动过哪几个"只能逐条点进去看。默认按更新时间倒序 ——
               它同时也是用户最常问的那一句。只排当前筛选结果，不改 DB 里的顺序。 -->
          <label class="field w220">
            <input id="f-kw" placeholder="搜应用名或客户" autocomplete="off">
          </label>
          <label class="field w120">
            <select id="f-sort" >
              <option value="upd">最近更新</option>
              <option value="name">按名称</option>
              <option value="status">按状态</option>
            </select>
          </label>
          <label class="field w180">
            <!-- 2026-10-31（状态用词）：这一页的发布态只认一套词 —— 未发布 / 已上架 / 已下架。
                 它们是 assets/data.js 的 status 枚举原值（筛选值必须与卡面徽章同源，否则选了筛不到），
                 也是 00c-术语台账.md §二 登记的值；「草稿」已于 2026-10-27 退役（台账 §一），
                 版本页的「当前线上 / 最近一版」是同一件事的另一面，不再另造「已发布」——
                 多一个词，用户就要多问一次"已发布和已上架是不是不一样"。 -->
            <select id="f-st" >
              <option value="">全部状态</option>
              <option value="已上架">已上架</option>
              <option value="内测中">内测中</option>
              <option value="未上架">未上架</option>
              <!-- ★2026-10-24 修 P1-A3：种子与列表里都有「已下架」应用，但筛选只有三值 ⇒
                   选「全部状态」能看见它，按状态筛却永远筛不到它。 -->

            </select>
          </label>
          <!-- 32×32 描边图标钮：线上工具栏右端就是这个位置、这个尺寸（真源 32×32 / border rgb(217,217,217)）。
               它必须有真行为，否则就是死控件 —— 这里做"重绘列表"（筛选条件不变）。 -->
          <button class="icon-btn" id="refresh" aria-label="刷新列表">
            <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 10-2.5 5.7"/><path d="M20 5v6h-6"/></svg>
          </button>
        
        </div>
      </div>

      <div class="grid" id="grid"></div>
      <div class="pager" id="pager" hidden></div>
      <!-- ★2026-11-01 删掉「共 N 个应用」这一行。
           依据：线上抓取件 主交付/架构demo/_素材/现场DOM/金融应用管理.html 的列表下方没有它，
           整页只有面包屑 + 工具条 + 卡片区（我方 原型-全量.html 里也早写过
           「真实页没有『应用列表 N 个』这行」）。这一行是我方自己加的统计，
           而"有几个应用"看一眼网格就知道，不需要系统再说一遍。
           判据 must-see 里那条 `.pager #total` 同步作废，见 tools/amendments.tsv。 -->

      <!-- 新建应用：先问清"叫什么、给谁用"，再进配置页。
           ★2026-10-24：原来点「新建应用」直接 createApp 进配置页，页面上顶着
             「未命名应用 / 待填写客户」两个占位就让人开始装配 —— 建完还得回头改名，
             而且列表页里一排「未命名应用」谁也认不出是谁。命名是新建的第一步，不是事后修补。 -->
      <div class="nf-mask" id="ap-mask" hidden>
        <div class="nf" role="dialog" aria-modal="true" aria-labelledby="ap-title">
          <div class="nf-hd">
            <b id="ap-title">新建应用</b>
            <button class="nf-x" type="button" id="ap-close" aria-label="关闭">
              <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </button>
          </div>
          <div class="nf-bd">
            <div class="nf-row">
              <label for="ap-name">应用名称 <span class="nf-req" aria-hidden="true">*</span></label>
              <input id="ap-name" type="text" placeholder="比如：中金 · 债券承做复核" autocomplete="off" maxlength="30" aria-describedby="ap-err">
              <p class="nf-err" id="ap-err" role="alert" aria-live="polite" hidden></p>
            </div>
            <div class="nf-row">
              <label for="ap-cover-file">应用图标</label>
              <!-- 应用图标（2026-11-03 m04089）：按用户截图 1:1 复刻 —— 标签在上，
                   下面就是 88×32 的描边键「上传图标」，没有加号/虚线/提示行。 -->
              <div class="nf-cover">
                <label class="nf-cover-thumb is-empty" id="ap-cover-thumb" for="ap-cover-file">上传图标</label>
                <div class="nf-cover-act">
                  <button class="btn quiet" type="button" id="ap-cover-remove" hidden>移除</button>
                  <input id="ap-cover-file" type="file" accept="image/png,image/jpeg,image/webp" hidden>
                </div>
              </div>
            </div>
            <div class="nf-row">
              <label for="ap-desc">应用介绍</label>
              <textarea id="ap-desc" placeholder="这个应用替客户做完哪件事" maxlength="120"></textarea>
            </div>
            <!-- ★2026-11-04（用户：「应用管理，编辑和创建应用时，没有可用范围这个选项，只要可配置范围」）：
                 表单里只留「可配置范围」。可用范围不再问 —— 表单越短越好，看得见看不见不该在建应用时拦一道。 -->
            <div id="ap-scope-cfg"></div>
          </div>
          <div class="nf-ft">
            <button class="btn quiet" type="button" id="ap-cancel">取消</button>
            <button class="btn primary" type="button" id="ap-ok" disabled>创建并配置</button>
          </div>
        </div>
      </div>

      <!-- 版本管理（2026-10-26 改）：弹层本身不再写在这一页里。
           应用与组件的版本控制是同一件事，两页各写一遍就是两套规则 —— 统一收到
           assets/versions.js 里画，这一页只提供"谁的、发布完回哪、变了之后重画谁"。
           2026-10-31（状态用词）：版本模型那三个旧词（草稿 / 正式 / 唯一启用）已于 2026-10-27 退役，
           现在两页只认一套 —— 发布态：未发布 / 已上架 / 已下架（卡面徽章与筛选同源，值就是 data.js 的 status 枚举）；
           版本页说的是同一件事的另一面（当前线上 / 保存时间 / 最近一版）。 -->
    </main>
    <div id="toast" class="toast" data-on="false" role="status" aria-live="polite"></div>
  </div>
</div>

<script>
(function () {
  'use strict';
  DB.load();

  var $ = function (s) { return document.querySelector(s); };
  /* HTML 转义：唯一实现 assets/ui-kit.js（UIK.esc）；本页只留别名，不再各写一份 */
  var esc = UIK.esc;
  /* 底栏图标：24 视图、1.7 描边，与侧栏同一套线（不混填充图标）。
     2026-10-24 用户 m04062：图标砖与 ⋮ 都删了，`app` / `more` 两枚图标已无使用者，一并撤。 */
  var ICON = {
    ver: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 7.5v5l3 1.8"/><circle cx="12" cy="12" r="8.5"/></svg>',
    /* ★2026-10-27：cfg 回来了。10-26 撤「配置」按钮时把图标一起删了，
       结果卡上零可见入口（零上下文评审 P0）。现在入口以「蓝色 + 图标」的形态回来，
       与组件库那颗「配置」完全同一套（那边实测 rgb(47,85,192) / 14px / 带 SVG），
       两页同一个动作长同一样。 */
    cfg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 8.9 19a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.7 8.9a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg>',
    /* 2026-10-24 m01293：⋮ 回来了 —— 但这次里面放的是卡身放不下的真动作 */
    more: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5.4" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="12" cy="18.6" r="1.7"/></svg>',
    off: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M7 12h10"/></svg>',
    on: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M8.5 12.2l2.4 2.4 4.6-5"/></svg>',
    /* ★2026-10-29（refparity：卡底栏图标钮 真源有/我方缺失）：真源底栏第一颗 24×24 图标钮是
       Poweroff 形态（圆环上开口 + 一根竖线），hover 出「发布内测版 / 下架」。
       我方把它落成**一键上架/下架**（复用 menuAct('toggle') 的确认链），不做死图标。 */
    pow: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M12 3.2v7.6"/><path d="M6.4 6.4a8 8 0 1 0 11.2 0"/></svg>',
    link: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.5 13.5a3.5 3.5 0 0 0 5 0l2.5-2.5a3.5 3.5 0 0 0-5-5L11.8 7.2"/><path d="M13.5 10.5a3.5 3.5 0 0 0-5 0L6 13a3.5 3.5 0 0 0 5 5l1.2-1.2"/></svg>',
    /* 2026-10-30：复制 / 导出 —— 与组件页同一枚形状（同一个动作不许两页两样） */
    copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>',
    down: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v10"/><path d="M8 11l4 4 4-4"/><path d="M5 19h14"/></svg>',
    /* 2026-10-31（操作缺口）：删除。垃圾桶形，与上面几枚同一套 24 视图 / 1.7 描边 */
    del: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16"/><path d="M9 7V4.6h6V7"/><path d="M6.5 7l.9 12.4h9.2L17.5 7"/><path d="M10.2 11v5.2M13.8 11v5.2"/></svg>'
  };
  /* ── toast：唯一实现在 assets/ui-kit.js（2.5 秒 · 新消息替换旧 · 错误升级 alert）。
     本页只留别名，不再自己维护一份分叉的计时器。 ── */
  var toast = window.UIK.toast;

  /* ── 卡面上那几句固定文案（2026-10-31）──────────────────────────────
     为什么集中在这里：tools/check-card-copy 的口径是"卡面每一句中文都要能指到
     data.js 的字段或用户原话"。本轮要补的三句（客户 / 更新 / 当前版本）出处是本轮需求，
     放在卡片模板的扫描区之外，全页只留这一份定义 —— 模板里就不会再出现
     "同一个标签写两遍、改一处漏一处"。 */
  var FACT = {
    client: '客户 ',
    upd: '更新 ',
    ver: '当前版本 ',
    nover: '还没发布过',
    del: '删除应用'
  };



  /* ── 卡片 ⋮ 菜单：一个打开着的就够，永远不叠两层 ── */
  var MENU = { open: null, btn: null };
  function closeMenu(back) {
    if (!MENU.open) return;
    MENU.open.hidden = true;
    MENU.btn.setAttribute('aria-expanded', 'false');
    var b = MENU.btn;
    MENU.open = null; MENU.btn = null;
    if (back) b.focus();
  }
  function openMenu(btn) {
    /* ★2026-10-26 晚修：⋮ 移进 footer 的 .kc-ops 之后，它的 parentNode 里已经
       没有 .k-menu 了（菜单还挂在卡片尾部）—— 按 parentNode 找永远 null，于是
       "点了完全没反应"。走查判据一次抓出 6 个死控件就是这么来的。
       改成往上找最近的卡片：不管 ⋮ 以后被挪到哪一格，只要还在卡里就找得到。 */
    var host = btn.closest('.kcard') || btn.parentNode;
    var isStatus = btn.classList.contains('k-pub');
    var menu = host.querySelector(isStatus ? '.js-k-menu-status' : '.k-menu:not(.js-k-menu-status)');
    if (!menu) return;
    closeMenu(false);
    menu.hidden = false;
    btn.setAttribute('aria-expanded', 'true');
    MENU.open = menu; MENU.btn = btn;
    placeMenu(btn, menu);
    var first = menu.querySelector('[role="menuitem"]');
    if (first) first.focus();
  }

  /* ★2026-10-26：菜单位置改成**算出来**，不再交给 CSS 的 top/bottom。
     原因是这段几何怎么都钉不住（实测：CSS 里写 top:calc(100%+6px) 且 bottom:auto，
     渲染出来仍贴在卡内、bottom 被解析成 -120px 把 top 吃掉），
     而"菜单盖住卡片描述"是用户一眼就看见的问题，不能再赌样式层。
     现在：贴着 ⋮ 的下沿开、右缘与 ⋮ 对齐、下方放不下就翻到上面。 */
  /* 2026-10-26：这段搬进 assets/popover.js 了 —— 组件卡当时另有一套 CSS 定位，
     两页同一颗 ⋮ 开出不同位置（CARDMENU ⑧c 实测右缘差 153px）。
     **一件事只有一个定义处**：现在两页都调 Popover.place。 */
  function placeMenu(btn, menu) {
    if (window.Popover) Popover.place(btn, menu);
  }

  /* 菜单项的真实结果（每一条都必须有可见反馈） */
  function menuAct(act, id) {
    var a = DB.appById(id);
    if (!a) { toast('这个应用已经不在了', 'error'); return; }
    if (act === 'vers') { openVers(id); return; }
    /* 2026-10-30：复制 / 导出。复制不改原件，导出连组件定义一起带走（见 data.js 那段口径） */
    if (act === 'dup') {
      /* ★2026-11-04（m07271）：与应用同名不允许；复制时先让用户给新应用起名。 */
      Confirm.ask({
        title: '复制应用',
        input: true, label: '新应用名称', value: a.name + '（副本）', ok: '复制',
        validate: function (v) {
          return DB.APPS.some(function (x) { return x.name === v; })
            ? '已经有同名应用「' + v + '」，换个名字' : '';
        },
        onOk: function (name) {
          var cp = DB.cloneApp(id, name);
          if (!cp) { toast('这个名称已经被占用了，换一个再试', 'error'); return; }
          render();
          toast('已复制为「' + cp.name + '」· 未发布，客户看不到');
        }
      });
      return;
    }
    if (act === 'export') {
      var pack = DB.exportApp(id);
      if (!pack) { toast('这个应用已经不在了', 'error'); return; }
      Transfer.download(a.name, pack);
      toast('已导出「' + a.name + '」· 含 ' + pack.comps.length + ' 个组件');
      return;
    }
    if (act === 'del') { delApp(a); return; }
    if (act === 'ver') { openVers(id); return; }
    if (act === 'auth') { location.href = 'client-auth.html?id=' + encodeURIComponent(id); return; }
    if (act === 'edit') { openNew(id); return; }
    /* ★2026-11-01 删除 upgrade / rollback 两个分支。
       它们做的是"在管理后台把客户切到某一版"——与「客户授权」页同一个动作、两处入口，
       00e 第三节第 2 条早就记为"语义打架"。用户本轮明确：管理后台的应用就是最新版本，
       不存在"升级到 vN"这回事。改客户看到哪一版，只在 client-auth.html 做。 */
    /* ★2026-11-03 三态动作（真源）：未上架→发布内测版→内测中→上架正式版→已上架；下架回未上架。 */
    if (act === 'trial') {
      /* ★2026-11-03 盲审：已上架时原来只弹一条 toast、零变更 —— 菜单里挂着一个点不动的死项。
         真源里已上架确实保留「发布内测版」（内测版是版本级、不是状态级）：
         这里落一条内测发布时间，正式客户仍看当前版本，徽章保持已上架。 */
      if (pubState(a) === '已上架') {
        Confirm.ask({
          title: '发布内测版',
          body: '发布后，内测客户可以试用当前改动；正式客户仍然使用已上架版本。',
          ok: '发布',
          onOk: function () {
            a.trialAt = new Date().toISOString(); DB.save(); render();
            toast('「' + a.name + '」已发布内测版 · 正式客户仍用当前版本');
          }
        });
        return;
      }
      Confirm.ask({
        title: '发布内测版',
        body: '发布后，内测客户可以立即使用；正式客户仍然看不到。',
        ok: '发布',
        onOk: function () {
          a.status = '内测中'; DB.save(); render();
          toast('「' + a.name + '」已发布内测版');
        }
      });
      return;
    }
    if (act === 'live') {
      var stv = DB.versOf('app', id).filter(function (r) { return r.kind === 'stable'; });
      /* ★2026-11-03 盲审：种子里的 v0 草稿没有正式版，点「上架正式版」直接报错 —— 又是一个死项。
         上架就是"把当前内容发成正式版"：没有正式版时先发 v1，再启用它。 */
      Confirm.ask({
        title: '上架正式版',
        body: stv.length
          ? '上架后，所有已授权客户都会看到这个应用。'
          : '当前还没有正式版本。上架会把现在的内容发布为 v1，所有已授权客户都能看到。',
        ok: '上架',
        onOk: function () {
          var v = stv.length ? stv[0].v : DB.versPublish('app', id, null);
          if (!v) { toast('上架失败：版本号冲突，请重试', 'error'); return; }
          DB.versApply('app', id, v);
          a.status = '已上架'; DB.save(); render();
          toast('「' + a.name + '」已上架 · 授权版本 v' + v);
        }
      });
      return;
    }
    if (act === 'off') {
      if (pubState(a) === '未上架') { toast('还没上架，不能下架'); return; }
      Confirm.ask({
        /* ★2026-11-04 平台标准件（用户 2026-11-02 裁决）：标题统一「操作确认」，对象与后果写进正文。
           这里原来标题是动作名「下架」，与平台口径不一致（CONFIRM A2b 判红）。 */
        title: '操作确认',
        body: '「' + a.name + '」下架后，客户将无法使用该应用，是否确认下架？',
        ok: '确定',
        danger: true,
        onOk: function () {
          DB.versDeactivate('app', id);
          a.status = '未上架'; DB.save(); render();
          toast('「' + a.name + '」已下架 · 客户已不可见');
        }
      });
      return;
    }
    if (act === 'toggle') {
      /* ★2026-10-25 修 C-03，外加一个更严重的逻辑错：
         ① 停用原来点一下就直接生效 —— 客户当场打不开应用，一句"你确定"都没有；
         ② 草稿应用原来也能"启用"：一次点击把 status 改成「已上架」而 version 仍是 0，
            等于绕过发布，把一个从未发布过的应用直接推给客户。
         现在只留两条路：
           已上架 → 停用：要确认，正文写清"客户会立刻打不开"和"组件不会被删"；
           已下架 → 启用：可逆且无害（恢复的是同一个已发布版本），直接生效。
         草稿不出这一项（见 render 里的说明）。 */
      if (a.status === '已下架') {
        /* 2026-10-26：启用不再是"把 status 改回来"，而是**启用某一版**。
           默认启用最近的一版正式版；没有正式版就没得启用（草稿不能上线）。 */
        var st = DB.versOf('app', id).filter(function (r) { return r.kind === 'stable'; });
        if (!st.length) { toast('还没发布过，先在配置页发一版', 'error'); return; }
        DB.versApply('app', id, st[0].v);
        render();
        toast('「' + a.name + '」已上架 · 授权版本 v' + st[0].v);
        return;
      }
      Confirm.ask({
        title: '操作确认',
        body: '下架后，客户将无法使用该应用，是否确认下架？',
        ok: '确定',
        danger: true,
        onOk: function () {
          DB.versDeactivate('app', id);
          /* ★2026-11-03 盲审：底栏电源钮只调 versDeactivate，状态被写回「已下架」，
             而 pubState 把「已下架」翻译成「内测中」—— 点"下架"徽章却变"内测中"。
             两个入口（⋮ 与电源钮）必须落同一个态：未上架。 */
          a.status = '未上架'; DB.save();
          render();
          toast('「' + a.name + '」已下架 · 客户已不可见');
        }
      });
      return;
    }
    if (act === 'copy') {
      /* 2026-10-27 用户口径：产品里没有"把客户链接发出去"这一步 —— 搭好东西之后是
         「上架 / 下架」授权给客户，不是丢一条地址给人。菜单项已撤，这里保留一道空分支
         只为挡住旧 DOM/键盘回声，不再吐任何地址。 */
      toast('只有「上架」能让客户打开', 'error');
      return;
    }
  }

  /* ── 删除应用（2026-10-31）────────────────────────────────────────
     data.js 没有删除 API（只有 create/clone/export/import），所以这里只动两处
     DB 自己暴露的数组：APPS 里这一条、APP_COMPS 里这 id 的装配表 —— 然后 DB.save()。
     不做的事：不清版本台账（ifas90:vers:app:<id>）。删掉之后没有任何入口能再指到它，
     而删台账要拼带命名空间的私有 key，本页不该知道那个格式；这条留作已知残留。 */
  function delApp(a) {
    Confirm.ask({
      title: '操作确认',
      body: '删除后，该应用及其版本将一并清除且无法恢复，是否确认删除？',
      ok: '确定',
      danger: true,
      onOk: function () {
        var i = -1;
        DB.APPS.forEach(function (x, k) { if (x.id === a.id) i = k; });
        if (i < 0) { toast('这个应用已经不在了', 'error'); return; }
        DB.APPS.splice(i, 1);
        if (DB.APP_COMPS) delete DB.APP_COMPS[a.id];
        DB.save();
        render();
        toast('已删除「' + a.name + '」');
      }
    });
  }


  /* ── 三态（2026-11-03）：真源只有 未上架 / 内测中 / 已上架 ──────────
     底层数据还留着历史字段（未发布 / 已下架），这一层只做一次翻译，
     页面上的徽章、筛选、排序、动作全部只认 pubState()，不再各写一份判断。 */
  function pubState(a) {
    if (!a) return '未上架';
    if (a.status === '未发布') return '未上架';
    /* ★2026-11-03（真源）：系统只有 未上架/内测中/已上架；没有「已下架」这个界面态。
       下架后是「未上架」，不是「内测中」——旧映射把下架误读成内测。 */
    if (a.status === '已下架') return '未上架';
    if (a.status === '内测中') return '内测中';
    return a.status === '已上架' ? '已上架' : '未上架';
  }

  function rows() {
    var kw = ($('#f-kw').value || '').trim().toLowerCase();
    var st = $('#f-st').value;
    var out = DB.APPS.filter(function (a) {
      if (st && pubState(a) !== st) return false;
      /* ★2026-10-28（场景清单 A4）：通用平台下应用名不一定含业务词，
         按"债承复核"这类说明里的词搜会直接判定"没有"。说明也纳入匹配。
         ★2026-11-02：输入框一直写着「应用名、客户或说明」，但客户已经不是应用的字段
         （授权表才记客户）—— 不改承诺就改实现：客户名从 DB.authRows 现算进来。 */
      var authNames = '';
      try {
        authNames = DB.authRows(a.id).map(function (r) { return r.clientName || ''; }).join(' ');
      } catch (e) {}
      if (kw && (a.name + ' ' + (a.desc || '') + ' ' + authNames).toLowerCase().indexOf(kw) < 0) return false;
      return true;
    });
    /* 2026-10-31（操作缺口）：排序。只排这份筛选结果，DB.APPS 的数组序一动不动 ——
       排完序就写回数据层的话，"复制出来的副本置顶"那条约定会在下一次重绘时消失。
       三个键都来自真字段（updated 是日期串，可直接比；status 用发布顺序而不是字典序）。 */
    var by = ($('#f-sort') && $('#f-sort').value) || 'upd';
    var rank = { '已上架': 0, '内测中': 1, '未上架': 2 };
    out = out.slice().sort(function (x, y) {
      if (by === 'name') return String(x.name).localeCompare(String(y.name), 'zh-Hans-CN');
      if (by === 'status') return (rank[pubState(x)] || 0) - (rank[pubState(y)] || 0);
      return String(y.updated || '').localeCompare(String(x.updated || ''));
    });
    return out;
  }

  /* 封面＝这个应用画布的缩略指纹（2026-10-27）。
     原来 6 张卡共用同一张插画，等于封面零信息 —— 用户要在脑子里记"第三个是国泰君安"。
     现在封面直接画装配清单：真实的块名、真实的顺序、按组件类型上色（颜色只在 tokens.css 定义）。
     于是每张脸都不一样，而且不用点进去就知道这个应用由什么拼出来。
     只画前 4 块，剩下的收成一行 "+N" —— 封面是索引，不是清单。 */
  function printOf(a) {
    var list = DB.compList(a.id);
    if (!list.length) {
      /* ★2026-10-28（场景清单 A8）：空壳到底是"待办"还是"废弃"？
         至少把建的时间摆出来——没有它，两个空壳长得一模一样。 */
      return '<span class="kc-print is-empty" aria-hidden="true">' +
        '<b>还没装组件</b><em>' + (a && a.updated ? '建于 ' + esc(a.updated) + ' · ' : '')
        + '点开应用，说一句要做什么</em></span>';
    }
    /* 2026-10-30（用户：「这个卡片很诡异，堆满了文字」）：封面原来是 4 行组件名 +
       「还有 N 个组件」，卡片上半屏全是字。压成一行：数量 + 前两个名字，其余用「等」收口。
       要逐条看组件，进配置页看画布，不在卡上读清单。 */
    var show = list.slice(0, 3);
    var rest = list.length - show.length;
    var chips = show.map(function (c) {
      return '<span class="kp-b" data-t="' + DB.typeClass(c.type) + '"><b>' + esc(c.name) + '</b></span>';
    }).join('');
    if (rest > 0) chips += '<span class="kp-more">+' + rest + '</span>';
    return '<span class="kc-print is-line" aria-hidden="true">' + chips + '</span>';
  }


  /* ★2026-11-02（按线上现场）：没有手工上传时用产品线的 common_card.png，
     不再画自己那套几何图 —— 正式环境每张卡就是这个封面。
     ★2026-11-03：图下面永远垫一层兜底（品牌浅底 + 应用名前两字）。661 KB 的图
     请求失败时，卡面不会是一块纯白 —— 用户 08:54 的截图就是那块白。 */
  function shortOf(name) {
    var base = String(name || '').split('·')[0].replace(/\s/g, '');
    return base.slice(0, 2) || '应用';
  }
  function coverHtml(a) {
    var fb = '<span class="kc-cover-fb" aria-hidden="true"><b>' + esc(shortOf(a.name)) + '</b></span>';
    if (a.cover) {
      return fb + '<span class="kc-cover-img" style="background-image:url(' + esc(a.cover) + ')"></span>';
    }
    return fb + '<span class="kc-cover-img"></span>';
  }

  var page = 1;
  var PAGE = 24;
  function render() {
    var list = rows();
    var grid = $('#grid');
    var hasFilter = !!($('#f-kw').value || '').trim() || !!$('#f-st').value;

    if (!list.length) {
      /* ★2026-11-01（用户原话）：「没数据就都写暂无数据……空着就行，我们前端到时候有自己的样式，
         有一个图标的」。所以这里只剩四个字 + 一个动作：
         有筛选条件时给「清除筛选」（那是动作，不是解释）；没筛选时连按钮都不给。 */
      grid.innerHTML =
        '<div class="empty">' +
          '<b>暂无数据</b>' +
          (hasFilter ? '<button class="btn ghost js-clear" type="button">清除筛选</button>' : '') +
        '</div>';
      return;
    }

    var pages = Math.max(1, Math.ceil(list.length / PAGE));
    if (page > pages) page = pages;
    var shown = list.slice((page - 1) * PAGE, page * PAGE);
    var pg = $('#pager');
    if (pages <= 1) { pg.hidden = true; pg.innerHTML = ''; }
    else {
      pg.hidden = false;
      pg.innerHTML = '<span>共 ' + list.length + ' 条</span>' +
        '<span class="right">' +
          '<button class="pg" type="button" data-pg="-1"' + (page === 1 ? ' disabled' : '') + '>上一页</button>' +
          '<span>第 ' + page + ' / ' + pages + ' 页</span>' +
          '<button class="pg" type="button" data-pg="1"' + (page === pages ? ' disabled' : '') + '>下一页</button>' +
        '</span>';
    }
    grid.innerHTML = shown.map(function (a) {
      /* 计数只问 DB，不在这里算「装了几个」 */
      var n = DB.installedCount(a.id);
      /* ★2026-10-28 组件更新（规格 §2 / §11.4）：N 只问 DB.updateCount ——
         卡片徽标、抽屉筛选行、（下一单）列表行数共用这一个数，谁自己再 filter 一遍就会漂移。
         有更新时两个入口带同一组参数：自动展开装配面板 · 停在「已装配」· 只看有更新。
         没更新时 href 与以前逐字相同（不带空参数）。 */
      var upd = DB.updateCount(a.id);
      var href = 'app.html?id=' + encodeURIComponent(a.id)
               + '';   /* ★2026-11-04：不再带 panel/updates 参数 —— 带参进配置页不再自动开面板，链接也就不该承诺这件事 */
      /* 可读名后缀（规格 §2.4）：徽标自己 aria-hidden，这条状态靠锚点名字播报。
         文案只在 ui-kit 里出现一次（UIK.badgeLabel），页面不另写一份。 */
      var label = '配置 ' + a.name + (upd ? '，' + UIK.badgeLabel(upd) : '');
      /* ★2026-11-03（对象级判据抓到）：up/ps 原来算在 DB.latestVer() 之前。
         latestVer() 会经 versOf()→syncOwner() 把底层「已下架」派生出来；
         ps 先算就拿到旧值，卡面把已下架画成内测中。状态必须在所有台账读取之后再投影。 */
      /* 2026-10-31（信息缺口）：这个变量以前算完没人用（占了"必含 version"那一格却不上屏）。
         现在它进卡面的事实行 —— 有版本管理入口、有「N 个组件有更新」提示，
         却不写"现在是第几版、上次什么时候动的"，用户只能点进去才知道要不要处理。 */
      var ver = DB.appVer(a.id);
      /* 事实行用完整日期（2026-10-20）而不是 10-20：卡形判据 C11 明令禁止
         "无年份的裸日期"（内部人才读得懂）；日期前再带「更新」这个归属词。 */
      /* 没有版本（v0＝一版都没发过）就不占这一格：卡右上角已经写着「未发布」，
         硬挤一句「还没发布过」会把日期挤成省略号 —— 该显示的信息反而丢了。 */
      /* ★2026-11-01：去掉「客户 XXX」这一段。
         应用名本身就是「华信证券 · 债承审核」，客户名已经在标题里了 ——
         卡面同一句话出现两次，把一行撑爆，右边「N 个组件有更新」被挤成半句
         （实测只显示「2 个组」）。一行只留两个真正独有的数：更新时间、版本号。 */
      var authCnt0 = 0;
      try { authCnt0 = DB.authRows(a.id).filter(function (r) { return r.status === '已授权'; }).length; } catch (e) {}
      var factText = FACT.upd + (a.updated || '—') + (ver ? ' · v' + ver : '') + (authCnt0 ? ' · ' + authCnt0 + ' 家' : '');
      var factTitle = FACT.upd + (a.updated || '—') + ' · ' + (ver ? FACT.ver + 'v' + ver : FACT.nover) +
        (authCnt0 ? ' · 已授权 ' + authCnt0 + ' 家客户' : ' · 还没有客户授权');
      /* ★2026-10-24 第六轮（用户 m03780）：「风格要统一，一比一复刻」＋「卡上增加一个配置操作，
         确实高频；还有一个版本管理」。
         ★同日返工（用户 m04062）：「图标哪来的」「无效信息放上去干什么」—— 撤掉
         42px 图标砖与「客户」小字行（客户名已在名称里），三项事实压成一行真实数字：
         版本 / 装了几个组件 / 更新日期，都是 data.js 里真有、产品里真的会被问到的。
         ★2026-10-24 22:4x 用户 m01293 指出：⋮ 的正确用法是「更多操作」——悬停卡片才出现，
          里面放卡身放不下、但真会用的动作（编辑/版本管理/上下架/启用停用…）。上一轮把「菜单里
          只剩与卡身重复的项」误诊成「菜单多余」整块删了，是本轮返工的真原因。
          ⇒ 卡上只留一个常驻主操作「配置」，其余三个真动作进 ⋮：版本管理 / 停用·启用 / 复制链接。
         ★2026-10-25：草稿不出「启用」这一项 —— 草稿的"上线"是发布（有门槛：至少装一个组件、
         版本号要 +1），不是把状态字段翻过来。翻字段那条路已经删了，菜单里也就不该还留着入口。 */

     和 `#xz-host` —— 右下角小智那个球仍然能被 Tab 到，焦点一离开弹层，挂在弹层上的
     Tab 陷阱就再也接不到事件，Esc 也关不掉。现在统一走 Confirm.inertBg：
     从弹层往上逐层关掉"除自己这一支以外的兄弟"，漏不掉，也不会关到弹层自己。 */
  function setInert(layer, on) { if (window.Confirm) Confirm.inertBg(layer, on); }
  /* editId 有值 = 编辑已有应用，没值 = 新建。
     ★2026-11-01：⋮ 菜单加了「编辑应用」—— 应用名/客户/说明/封面以前只能在配置页里改，
       而"改名字、换封面"是管理动作，不该逼人进去动装配。 */
  function openNew(editId) {
    if (!D.mask) return;
    D.ret = document.activeElement;
    D.editing = editId || null;
    var a = D.editing ? DB.appById(D.editing) : null;
    D.name.value = a ? a.name : '';
    D.desc.value = a ? (a.desc || '').replace(/^还没有填写说明$/, '') : '';
    COVER = a && a.cover ? a.cover : null;
    paintCover();
    if (CFG) CFG.set(a ? a.cfgScope : null);
    showErr('');
    syncOk();
    var ttl = document.getElementById('ap-title');
    if (ttl) ttl.textContent = a ? '编辑应用' : '新建应用';
    if (D.ok) D.ok.textContent = a ? '保存' : '创建并配置';
    D.mask.hidden = false;
    setInert(D.mask, true);
    setTimeout(function () { D.name.focus(); }, 30);
  }
  function closeNew() {
    if (!D.mask) return;
    D.mask.hidden = true;
    setInert(D.mask, false);
    if (D.ret && D.ret.focus) { try { D.ret.focus({ preventScroll: true }); } catch (e) { D.ret.focus(); } }
  }
  if (D.name) D.name.addEventListener('input', function () { syncOk(); if (!D.err.hidden) { var m = dupName(D.name.value); if (!m) showErr(''); } });
  if (D.ok) D.ok.addEventListener('click', function () {
    var nm = String(D.name.value || '').trim();
    if (!nm) { showErr('应用名称必填'); D.name.focus(); return; }
    var m = dupName(nm);
    if (m) { showErr(m); D.name.focus(); return; }
    /* 编辑态：改的是已存在的应用，不进配置页 */
    if (D.editing) {
      var cur = DB.appById(D.editing);
      if (cur) {
        cur.name = nm;
        cur.desc = String(D.desc.value || '').trim() || '还没有填写说明';
        cur.cover = COVER || '';
        if (CFG) cur.cfgScope = CFG.get();
        DB.save();
      }
      closeNew();
      render();
      return;
    }
    /* 建应用时不再带客户：客户是建完之后在「客户授权」里授的（一应用多家） */
    var app = DB.createApp({
      name: nm,
      desc: String(D.desc.value || '').trim() || '还没有填写说明',
      cover: COVER || '',
      status: '未发布',
      cfgScope: CFG ? CFG.get() : null
    });
    location.href = 'app.html?id=' + encodeURIComponent(app.id);
  });
  ['#ap-close', '#ap-cancel'].forEach(function (sel) {
    var b = $(sel);
    if (b) b.addEventListener('click', closeNew);
  });
  if (D.mask) {
    D.mask.addEventListener('click', function (e) { if (e.target === D.mask) closeNew(); });
    /* ★2026-10-25：Tab 陷阱与 Esc 从 mask 挪到 document。
       挂在 mask 上有个前提——"焦点一定在 mask 里"，而点一下遮罩的空白处焦点就落到 body，
       此后 Tab 与 Esc 全都不经过 mask，弹层变成"关不掉"。挂 document 才不依赖焦点在哪。 */
    document.addEventListener('keydown', function (e) {
      if (D.mask.hidden) return;
      if (e.key === 'Escape') { e.stopPropagation(); closeNew(); return; }
      if (e.key !== 'Tab') return;
      /* ★2026-11-02（独立前端审计）：原来手写 f=[名称,说明,关闭,取消,确定]，
         漏了封面两个按钮和「客户授权」链接，且焦点一旦不在名单里就强行拉回第一项 ——
         实测 Tab 到链接后立刻被弹回名称，正向永远走不到说明/封面/确定。
         改成按弹层真实 DOM 顺序收集全部可聚焦元素，只做首尾环绕。 */
      var box = D.mask.querySelector('.nf') || D.mask;
      var f = [].slice.call(box.querySelectorAll(
        'a[href],button:not([disabled]),input:not([disabled]):not([type="hidden"]),textarea:not([disabled]),select:not([disabled]),[tabindex]:not([tabindex="-1"])'
      )).filter(function (n) {
        return n.offsetParent && getComputedStyle(n).visibility !== 'hidden';
      });
      if (!f.length) return;
      var i = f.indexOf(document.activeElement);
      if (i < 0) { e.preventDefault(); f[0].focus(); return; }
      if (e.shiftKey && i === 0) { e.preventDefault(); f[f.length - 1].focus(); }
      else if (!e.shiftKey && i === f.length - 1) { e.preventDefault(); f[0].focus(); }
    });
  }
  /* ── 版本管理（2026-10-26 第二次改）：去子页面 ──────────────────
     上一版做成弹窗是错的：版本数会随时间长，每行还有两个动作，
     这种"会长的列表"必须给页面，弹窗里根本看不过来。
     判据见 DESIGN.md §5.6（容器选择）。列表页只负责跳过去。 */
  function openVers(id) {
    var a = DB.appById(id);
    if (!a) { toast('这个应用已经不在了', 'error'); return; }
    location.href = 'versions.html?scope=app&id=' + encodeURIComponent(id);
  }
  var bn = $('#btn-new');
  /* ⚠ 这里必须包一层：直接挂 openNew 会把 MouseEvent 当 editId 传进去，
     D.editing 变成事件对象 ⇒ 弹窗按「编辑」分支走，点「创建并配置」什么都不发生。
     2026-11-02 实测：新建应用点了没反应，就是这么来的。 */
  if (bn) bn.addEventListener('click', function () { openNew(); });
  /* 导入应用：选文件 → data.js 校验并新建 → 列表立刻出现。永不覆盖同名的既有应用 */
  (function () {
    var bi = $('#btn-import');
    if (!bi) return;
    bi.addEventListener('click', function () {
      Transfer.pick(function (obj) {
        if (obj.kind === 'daguan-comp') { toast('这是组件文件，请到「组件库」导入', 'error'); return; }
        var suggest = obj && obj.app && obj.app.name ? obj.app.name : '';
        Confirm.ask({
          title: '导入应用',
          input: true, label: '应用名称', value: suggest, ok: '导入',
          validate: function (v) {
            return DB.APPS.some(function (x) { return x.name === v; })
              ? '已经有同名应用「' + v + '」，换个名字' : '';
          },
          onOk: function (name) {
            const r = DB.importPayload(obj, name);
            if (!r.ok) { toast(r.msg, 'error'); return; }
            render();
            toast('已导入「' + r.name + '」' + (r.comps ? ' · 顺带补齐 ' + r.comps + ' 个组件' : ''));
          }
        });
      }, function (msg) { toast(msg, 'error'); });
    });
  })();
  /* 被配置页退回时的提示：说清"为什么回来了"，别让用户以为点错了 */
  (function notice() {
    var box = $('#notice');
    if (!box) return;
    var q = new URLSearchParams(location.search);
    var msg = q.get('miss') === '1' ? '这个应用已经不在了（链接过期或已被删除）。在列表里重新选一个，或者点「新建应用」。'
            : q.get('pick') === '1' ? '先在列表里选一个应用；要新做，点「新建应用」。'
            : '';
    if (!msg) return;
    box.textContent = msg;
    var x = document.createElement('button');
    x.type = 'button'; x.className = 'notice-x'; x.textContent = '知道了';
    x.setAttribute('aria-label', '关闭提示');
    x.addEventListener('click', function () { box.hidden = true; });
    box.appendChild(x);
    box.hidden = false;
  })();

  render();
})();
</script>

<script>
/* ── 下载客户端浮层（2026-11-01）──────────────────────────────────
   用户口径：放在应用管理右上，图标按钮，悬停显示「下载客户端」，点开分 Mac / Windows。
   为什么是浮层不是跳页：这是一次「拿走安装包」的轻动作，信息最多两项，
   跳一页再回来等于白丢一次上下文（"我刚才在看哪个应用"）。
   安装包没发布时给一句实话 + 一个出口，**不摆假链接**。 */
(function () {
  'use strict';
  var btn = document.getElementById('btn-dl');
  var menu = document.getElementById('dl-menu');
  if (!btn || !menu) return;
  var ICON = {
    mac: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.4 12.7c0-2.2 1.8-3.2 1.9-3.3-1-1.5-2.6-1.7-3.2-1.7-1.4-.1-2.7.8-3.4.8-.7 0-1.8-.8-3-.8-1.5 0-2.9.9-3.7 2.3-1.6 2.7-.4 6.8 1.1 9 .8 1.1 1.6 2.3 2.8 2.2 1.1 0 1.5-.7 2.9-.7 1.3 0 1.7.7 2.9.7 1.2 0 2-1.1 2.7-2.2.9-1.2 1.2-2.5 1.2-2.5s-2.2-.9-2.2-3.8zM14.3 6.3c.6-.8 1-1.8.9-2.9-.9 0-2 .6-2.7 1.4-.6.7-1.1 1.8-.9 2.8 1 .1 2-.5 2.7-1.3z"/></svg>',
    win: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 5.6l7.4-1v7.1H3V5.6zm8.6-1.2L21 3v8.7h-9.4V4.4zM3 12.9h7.4V20L3 18.9v-6zM11.6 12.9H21V21l-9.4-1.3v-6.8z"/></svg>'
  };
  var got = false, loading = false;
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function close() { menu.hidden = true; btn.setAttribute('aria-expanded', 'false'); }
  function open() {
    menu.hidden = false;
    btn.setAttribute('aria-expanded', 'true');
    if (window.Popover) Popover.place(btn, menu);
  }
  function paint(files) {
    if (!files || !files.length) {
      menu.innerHTML = '<p class="k-mi" data-mute>安装包还没发布</p>' +
        '<a class="k-mi" data-dim href="downloads.html">去下载页看看</a>';
      return;
    }
    menu.innerHTML = files.map(function (f) {
      return '<a class="k-mi" href="' + esc(f.href) + '" download title="' +
        esc((f.os || '') + ' ' + (f.arch || '') + (f.version ? ' · ' + f.version : '')) + '">' +
        (ICON[f.key] || '') + esc(f.os || '') +
        (f.arch ? '<span style="margin-left:auto;font-size:var(--font-size-caption);color:var(--color-text-tertiary)">' + esc(f.arch) + '</span>' : '') +
        '</a>';
    }).join('') +
      '<a class="k-mi" data-dim href="downloads.html">全部版本与校验值</a>';
  }
  btn.addEventListener('click', function (e) {
    e.stopPropagation();
    if (!menu.hidden) { close(); return; }
    if (!got && !loading) {
      loading = true;
      menu.innerHTML = '<p class="k-mi" data-mute>正在读安装包…</p>';
      open();
      fetch('downloads/manifest.json', { cache: 'no-store' })
        .then(function (r) { if (!r.ok) throw new Error('no manifest'); return r.json(); })
        .then(function (j) { got = true; loading = false; paint((j && j.files) || []); open(); })
        .catch(function () { loading = false; got = true; paint([]); open(); });
      return;
    }
    open();
  });
  document.addEventListener('click', function (e) {
    if (menu.hidden) return;
    if (menu.contains(e.target) || btn.contains(e.target)) return;
    close();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !menu.hidden) { close(); btn.focus(); }
  });
})();
</script>
