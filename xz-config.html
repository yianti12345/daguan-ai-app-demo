<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小智配置</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23587FFF'/%3E%3Crect x='8' y='9' width='16' height='3' rx='1.5' fill='white'/%3E%3Crect x='8' y='15' width='11' height='3' rx='1.5' fill='white' opacity='.75'/%3E%3Crect x='8' y='21' width='7' height='3' rx='1.5' fill='white' opacity='.5'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/tokens.css?v=308f06b8">
<link rel="stylesheet" href="assets/sys.css?v=155deb7d">
<link rel="stylesheet" href="assets/xiaozhi.css?v=3e223187">
<style>
/* 列与真源 /Expert/Management/SkillsLibrary 一致：8 列、表头 39、行 69。取值全来自令牌。 */
.page-hd{display:flex;align-items:flex-start;gap:var(--space-12);margin:0 0 var(--space-12)}
.page-hd h1{margin:0;font-size:var(--font-size-display);font-weight:600;line-height:var(--leading-display);color:var(--color-text-primary)}
.page-hd .ops{margin-left:auto;display:flex;align-items:center;gap:var(--space-8)}
.sk-bar{display:flex;align-items:center;gap:var(--space-8);flex-wrap:wrap;padding:0 0 var(--space-12)}
.sk-pg{margin-left:auto;color:var(--color-text-tertiary)}
.sk-name{color:var(--color-text-primary);font-weight:500}
.sk-desc{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--color-text-secondary)}
.sk-at{color:var(--color-text-secondary);font-variant-numeric:tabular-nums}
.sk-ops{display:flex;align-items:center;gap:var(--space-12);justify-content:flex-end}
.sk-op{height:24px;padding:0;border:0;background:none;font-family:inherit;font-size:var(--font-size-body);color:var(--color-brand-ink);cursor:pointer;white-space:nowrap}
.sk-op:hover{text-decoration:underline}
.sk-op.is-danger{color:var(--color-danger)}
.sk-form{display:flex;flex-direction:column;gap:var(--space-12)}
.sk-form label{display:flex;flex-direction:column;gap:var(--space-8);font-size:var(--font-size-caption);color:var(--color-text-secondary)}
.sk-form input,.sk-form textarea,.sk-form select{height:32px;border:1px solid var(--color-border-control);border-radius:var(--radius-xs);padding:0 var(--space-12);font-family:inherit;font-size:var(--font-size-body);color:var(--color-text-primary);background:var(--surface-page)}
.sk-form textarea{height:88px;padding:var(--space-8) var(--space-12);line-height:1.6;resize:vertical}
.sk-form input:focus,.sk-form textarea:focus,.sk-form select:focus{outline:2px solid var(--color-brand);outline-offset:-1px;border-color:var(--color-brand)}
.sk-drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--space-8);height:120px;border:1px dashed var(--color-border-control);border-radius:var(--radius-tag);color:var(--color-text-tertiary);font-size:var(--font-size-body);cursor:pointer}
.sk-drop:hover{border-color:var(--color-brand);color:var(--color-brand-ink)}
.sk-drop input{display:none}
.sk-hint{font-size:var(--font-size-caption);color:var(--color-text-tertiary)}
.sk-sp{flex:1 1 auto}
/* 小智配置页：人设在上、技能在下。人设按真源「其他配置」的表单长相：
   不带卡片框、标签带红星、说明小字在标签下、文本框白底描边、保存压在右上。 */
.cfg-form{margin:0 0 var(--space-32);max-width:760px}
.cf-hd{display:flex;align-items:center;gap:var(--space-8)}
.cf-lb{font-size:var(--font-size-body);color:var(--color-text-body)}
.cf-lb i{font-style:normal;color:var(--color-danger);margin-right:2px}
.cf-hd .cf-save{margin-left:auto}
.cf-ta{display:block;width:100%;box-sizing:border-box;height:168px;margin-top:var(--space-8);padding:var(--space-12);
  border:1px solid var(--color-border-control);border-radius:var(--radius-control);background:var(--surface-page);
  resize:vertical;font-family:inherit;font-size:var(--font-size-body);line-height:1.7;color:var(--color-text-body)}
.cf-ta:focus{outline:2px solid var(--color-brand);outline-offset:-1px;border-color:var(--color-brand)}
.sec-t{margin:0 0 var(--space-12);font-size:var(--font-size-body);font-weight:600;color:var(--color-text-primary)}
.sk-form textarea.sk-ta-lg{height:160px}
</style>
  <meta name="robots" content="noindex,nofollow">
</head>
<body>

<div class="app">
  <nav class="sider" data-active="cfg-xz"></nav>
  <div class="workspace">
    <header class="hdr">
      <nav class="crumb">
        <b>配置管理</b>
        <span class="sep" aria-hidden="true"><svg aria-hidden="true" viewBox="0 0 14 14" fill="currentColor"><path d="M4.396 2.146a.5.5 0 0 0-.057.638l.057.07L8.543 7l-4.147 4.146a.5.5 0 0 0-.057.638l.057.07a.5.5 0 0 0 .638.057l.07-.057 4.5-4.5a.5.5 0 0 0 .057-.638l-.057-.07-4.5-4.5a.5.5 0 0 0-.708 0Z"/></svg></span>
        <b>小智配置</b>
      </nav>
      <div class="me"><span>admin</span><u>ad</u></div>
    </header>

    <main class="main">
      <h1 class="sr-only">小智配置</h1>

      <!-- 2026-11-05：照真源「能力配置 → 其他配置」的表单样式 —— 标签带红星、说明小字在下、
           白底描边大文本框、保存按钮压在表单右上。真源没有卡片框，所以这里也不套卡片。 -->
      <section class="cfg-form" aria-labelledby="cp-t">
        <div class="cf-hd">
          <span class="cf-lb" id="cp-t"><i aria-hidden="true">*</i>默认系统提示词：</span>
          <button type="button" class="btn primary cf-save" id="p-save" disabled>保存</button>
        </div>
        <textarea id="p-text" class="cf-ta" aria-labelledby="cp-t" placeholder="例如：你是达观平台的业务助理，回答要严谨，不确定就说不确定，不许编造数据。"></textarea>
      </section>

      <h2 class="sec-t">Skill 技能</h2>

      <!-- 真源形态：面包屑下面紧跟一条工具条 —— 左边操作、右边筛选，然后直接是表格。 -->
      <div class="sk-bar">
        <button type="button" class="btn ghost" id="act-import">导入</button>
        <button type="button" class="btn ghost" id="act-new">新建 skill</button>
        <span class="bar-sp"></span>
        <label class="field w220"><input id="kw" placeholder="搜 skill 名称或描述" autocomplete="off"></label>
        <label class="field w120"><select id="f-on"><option value="">是否启用</option><option value="1">已启用</option><option value="0">已停用</option></select></label>
      </div>

      <div class="sk-table gtable">
        <div class="gtable-head" id="head" aria-hidden="true"></div>
        <div class="gtable-body" id="list" role="list" aria-label="技能列表"></div>
        <div class="gtable-foot"><span id="total"></span><span class="sk-pg">15 条/页</span></div>
      </div>
    </main>
    <div id="toast" class="toast" data-on="false" role="status" aria-live="polite"></div>
  </div>
</div>

<!-- 新建 skill -->
<div class="nf-mask" id="dlg" hidden>
  <div class="nf" role="dialog" aria-modal="true" aria-labelledby="dlg-t">
    <div class="nf-hd">
      <b id="dlg-t">新建 skill</b>
      <button type="button" class="icon-btn" id="dlg-x" aria-label="关闭">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="nf-bd">
      <div class="sk-form">
        <label for="f-name">skill 名称<input id="f-name" placeholder="例如：财报三表勾稽"></label>
        <label for="f-desc">skill 描述<textarea id="f-desc" placeholder="它能做什么"></textarea></label>
      </div>
    </div>
    <div class="nf-ft">
      <span class="sk-sp"></span>
      <button type="button" class="btn ghost" id="dlg-cancel">取消</button>
      <button type="button" class="btn primary" id="dlg-save">保存</button>
    </div>
  </div>
</div>

<!-- 导入 skill -->
<div class="nf-mask" id="imp" hidden>
  <div class="nf" role="dialog" aria-modal="true" aria-labelledby="imp-t">
    <div class="nf-hd">
      <b id="imp-t">导入 Skill</b>
      <button type="button" class="icon-btn" id="imp-x" aria-label="关闭">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="nf-bd">
      <label class="sk-drop" for="file">
        <input type="file" id="file" accept=".zip,.md,.json,.txt">
        <span id="drop-t">点击选择技能包</span>
        <span class="sk-hint">.zip / .md / .json / .txt</span>
      </label>
      <div class="sk-form" style="margin-top:var(--space-12)">
        <label for="i-name">skill 名称<input id="i-name" placeholder="从文件名带出，可改"></label>
        <label for="i-scope">可用范围<select id="i-scope"><option>仅自己</option><option>全平台</option></select></label>
      </div>
    </div>
    <div class="nf-ft">
      <span class="sk-sp"></span>
      <button type="button" class="btn ghost" id="imp-cancel">取消</button>
      <button type="button" class="btn primary" id="imp-do" disabled>导入</button>
    </div>
  </div>
</div>

<!-- 详情：只读看这一条技能 -->
<div class="nf-mask" id="det" hidden>
  <div class="nf" role="dialog" aria-modal="true" aria-labelledby="det-t">
    <div class="nf-hd">
      <b id="det-t">技能详情</b>
      <button type="button" class="icon-btn" id="det-x" aria-label="关闭">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="nf-bd" id="det-bd"></div>
    <div class="nf-ft">
      <span class="sk-sp"></span>
      <button type="button" class="btn ghost" id="det-close">关闭</button>
      <button type="button" class="btn primary" id="det-toggle">停用</button>
    </div>
  </div>
</div>

<script src="assets/shell.js?v=1736883e"></script>
<script src="assets/ui-kit.js?v=bc773bc9"></script>
<script src="assets/confirm.js?v=ad0ffde9"></script>
<script src="assets/spec.js?v=837054ad"></script>
<script src="assets/list.js?v=99cbc618"></script>
<script src="assets/capability.js?v=089bd664"></script>
<script>
/* 系统提示词：跟接口/技能存在同一份 CAP 数据里，跟着导出导入一起走。 */
(function () {
  var t = document.getElementById('p-text');
  var b = document.getElementById('p-save');
  if (!t || !b || !window.CAP) return;
  t.value = CAP.prompt();
  /* 没改过就没什么可存：按钮先灰着，改一个字才亮。省掉"点了没反应"的困惑。 */
  var dirty = false;
  function setDirty(v) { dirty = v; b.disabled = !v; }
  t.addEventListener('input', function () { setDirty(t.value !== CAP.prompt()); });
  b.addEventListener('click', function () {
    CAP.setPrompt(t.value);
    setDirty(false);
    if (window.UIK && UIK.toast) UIK.toast('已保存');
  });
  setDirty(t.value !== CAP.prompt());
})();
</script>
<script src="assets/skills.js?v=5a8a5d3f"></script>
</body>
</html>
