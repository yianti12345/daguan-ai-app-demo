<body class="landing">
<!-- 落地汇总页（2026-11-06）
     用户原话：「我希望这个地址，点击进去，先是一个汇总，就是达观数据智能平台，11月份版本迭代，
     然后 2 个入口一个 saas 端，一个管理后台，不然都没有入口去跳转看了」。
     两个入口分别对应两种视角：
       SaaS 端   = 客户登录后打开应用的那一屏（app.html?mode=view，只有内容与平台条）
       管理后台  = 配置应用/组件/能力/客户授权的那一套（app-manage.html 起） -->
<main class="ld-wrap">
  <header class="ld-hd">
    <span class="ld-logo" aria-hidden="true">达</span>
    <b>达观数据智能审核平台</b>
  </header>

  <section class="ld-hero">
    <h1>11 月版本迭代</h1>
    <p>两个入口：客户看到的那一屏，和你把它配出来的那一屏。</p>
  </section>

  <nav class="ld-cards" aria-label="选择要看的端">
    <a class="ld-card" href="my-apps.html">
      <span class="ld-tag">SaaS 端</span>
      <b>客户应用</b>
      <p>客户登录后先看到自己的应用，点进任意一个只剩内容与任务；装配、保存、对话这些配置入口一个都不出现。</p>
      <span class="ld-go">进去看看 →</span>
    </a>
    <a class="ld-card" href="app-manage.html">
      <span class="ld-tag">管理后台</span>
      <b>配置台</b>
      <p>应用与组件、能力与模型、客户授权，以及每一次版本升级都在这里发生。</p>
      <span class="ld-go">进去看看 →</span>
    </a>
  </nav>

  <footer class="ld-ft">2026 年 11 月</footer>
</main>
</body>
</html>
