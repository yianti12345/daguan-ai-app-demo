<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>Wire B</title>
<style>
  html,body{margin:0;background:#F5F6F9;color:#333;font:14px/1.5 -apple-system,"PingFang SC",sans-serif}
  .side{position:fixed;left:0;top:0;bottom:0;width:224px;background:#ECEEF3;padding:20px}
  .main{margin-left:224px;padding:24px 56px}
  .bar{height:32px;display:flex;gap:12px;align-items:center;margin-bottom:20px}
  .btn{width:110px;height:32px;background:#DDD;border-radius:6px}
  .grow{flex:1}
  .ctl{width:190px;height:32px;background:#E6E8ED;border-radius:6px}
  .table{background:#fff;border-radius:12px;box-shadow:0 1px 2px rgba(0,0,0,.06);overflow:hidden}
  .hd{display:grid;grid-template-columns:44px 1fr 150px 70px 88px 96px 32px;gap:16px;padding:10px 16px;background:#F0F2F6;font-size:12px;color:#8A8F99}
  .row{display:grid;grid-template-columns:44px 1fr 150px 70px 88px 96px 32px;gap:16px;align-items:center;padding:12px 16px;border-top:1px solid #EEF0F4}
  .tile{width:36px;height:36px;background:#EDEFF3;border-radius:8px}
  .nm{height:14px;background:#D7DBE2;border-radius:3px;width:52%}
  .ds{height:9px;background:#E7EAF0;border-radius:3px;width:86%;margin-top:7px}
  .ref{height:12px;background:#E9ECF1;border-radius:3px;width:80%}
  .ver{height:12px;background:#E9ECF1;border-radius:3px;width:34px}
  .tag{height:20px;background:#E3E7EE;border-radius:10px;width:56px}
  .k{height:28px;background:#E3E6EC;border-radius:6px}
  .more{width:26px;height:26px;background:#ECEEF2;border-radius:6px}
</style></head><body>
<div class="side"></div>
<div class="main">
  <div class="bar"><div class="btn"></div><div class="grow"></div><div class="ctl"></div><div class="ctl"></div></div>
  <div class="table">
    <div class="hd"><span></span><span>名称 / 说明</span><span>被哪些应用使用</span><span>版本</span><span>状态</span><span>操作</span><span></span></div>
    <div class="row"><div class="tile"></div><div><div class="nm"></div><div class="ds"></div></div><div class="ref"></div><div class="ver"></div><div class="tag"></div><div class="k"></div><div class="more"></div></div>
    <div class="row"><div class="tile"></div><div><div class="nm"></div><div class="ds"></div></div><div class="ref"></div><div class="ver"></div><div class="tag"></div><div class="k"></div><div class="more"></div></div>
    <div class="row"><div class="tile"></div><div><div class="nm"></div><div class="ds"></div></div><div class="ref"></div><div class="ver"></div><div class="tag"></div><div class="k"></div><div class="more"></div></div>
    <div class="row"><div class="tile"></div><div><div class="nm"></div><div class="ds"></div></div><div class="ref"></div><div class="ver"></div><div class="tag"></div><div class="k"></div><div class="more"></div></div>
    <div class="row"><div class="tile"></div><div><div class="nm"></div><div class="ds"></div></div><div class="ref"></div><div class="ver"></div><div class="tag"></div><div class="k"></div><div class="more"></div></div>
    <div class="row"><div class="tile"></div><div><div class="nm"></div><div class="ds"></div></div><div class="ref"></div><div class="ver"></div><div class="tag"></div><div class="k"></div><div class="more"></div></div>
    <div class="row"><div class="tile"></div><div><div class="nm"></div><div class="ds"></div></div><div class="ref"></div><div class="ver"></div><div class="tag"></div><div class="k"></div><div class="more"></div></div>
    <div class="row"><div class="tile"></div><div><div class="nm"></div><div class="ds"></div></div><div class="ref"></div><div class="ver"></div><div class="tag"></div><div class="k"></div><div class="more"></div></div>
  </div>
</div>
</body></html>
