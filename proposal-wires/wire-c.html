<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>Wire C</title>
<style>
  html,body{margin:0;background:#F5F6F9;color:#333;font:14px/1.5 -apple-system,"PingFang SC",sans-serif}
  .side{position:fixed;left:0;top:0;bottom:0;width:224px;background:#ECEEF3;padding:20px}
  .main{margin-left:224px;padding:24px 56px}
  .bar{height:32px;display:flex;gap:12px;align-items:center;margin-bottom:20px}
  .btn{width:110px;height:32px;background:#DDD;border-radius:6px}
  .grow{flex:1}
  .ctl{width:190px;height:32px;background:#E6E8ED;border-radius:6px}
  .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:32px}
  .card{height:194px;background:#fff;border-radius:12px;box-shadow:0 1px 2px rgba(0,0,0,.06);display:flex;flex-direction:column;position:relative;overflow:hidden}
  .hd{padding:16px 16px 0;display:flex;align-items:center;gap:8px}
  .ttl{height:16px;background:#D7DBE2;border-radius:3px;width:56%}
  .ver{height:14px;background:#E9ECF1;border-radius:3px;width:26px}
  .body{padding:10px 16px 0;flex:1}
  .body i{display:block;height:10px;background:#E4E7EC;border-radius:3px;margin-bottom:6px}
  .body i:nth-child(2){width:78%}
  .stack{position:absolute;right:16px;bottom:64px;display:flex}
  .av{width:22px;height:22px;border-radius:50%;background:#DDE1E8;border:2px solid #fff;margin-left:-6px}
  .cnt{font-size:11px;color:#9AA0AA;margin-left:6px}
  .meta{padding:0 16px;height:14px;background:#E9ECF1;border-radius:3px;width:50%}
  .ft{margin-top:auto;padding:10px 12px 12px;display:flex;gap:8px;border-top:1px solid #EEF0F4}
  .k{width:74px;height:28px;background:#E3E6EC;border-radius:6px}
  .tag{position:absolute;right:14px;top:14px;width:26px;height:26px;background:#ECEEF2;border-radius:6px}
</style></head><body>
<div class="side"></div>
<div class="main">
  <div class="bar"><div class="btn"></div><div class="grow"></div><div class="ctl"></div><div class="ctl"></div></div>
  <div class="grid">
    <div class="card"><div class="hd"><div class="ttl"></div><div class="ver"></div></div><div class="body"><i></i><i></i></div><div class="stack"><div class="av"></div><div class="av"></div><div class="av"></div><span class="cnt">+2</span></div><div class="meta"></div><div class="ft"><div class="k"></div></div><div class="tag"></div></div>
    <div class="card"><div class="hd"><div class="ttl"></div><div class="ver"></div></div><div class="body"><i></i><i></i></div><div class="stack"><div class="av"></div><div class="av"></div><span class="cnt">+1</span></div><div class="meta"></div><div class="ft"><div class="k"></div></div><div class="tag"></div></div>
    <div class="card"><div class="hd"><div class="ttl"></div><div class="ver"></div></div><div class="body"><i></i><i></i></div><div class="stack"><div class="av"></div><span class="cnt">+0</span></div><div class="meta"></div><div class="ft"><div class="k"></div></div><div class="tag"></div></div>
    <div class="card"><div class="hd"><div class="ttl"></div><div class="ver"></div></div><div class="body"><i></i><i></i></div><div class="stack"><div class="av"></div><div class="av"></div><span class="cnt">+1</span></div><div class="meta"></div><div class="ft"><div class="k"></div></div><div class="tag"></div></div>
    <div class="card"><div class="hd"><div class="ttl"></div><div class="ver"></div></div><div class="body"><i></i><i></i></div><div class="stack"><div class="av"></div><span class="cnt">+0</span></div><div class="meta"></div><div class="ft"><div class="k"></div></div><div class="tag"></div></div>
    <div class="card"><div class="hd"><div class="ttl"></div><div class="ver"></div></div><div class="body"><i></i><i></i></div><div class="stack"><div class="av"></div><div class="av"></div><span class="cnt">+1</span></div><div class="meta"></div><div class="ft"><div class="k"></div></div><div class="tag"></div></div>
    <div class="card"><div class="hd"><div class="ttl"></div><div class="ver"></div></div><div class="body"><i></i><i></i></div><div class="stack"><span class="cnt">未使用</span></div><div class="meta"></div><div class="ft"><div class="k"></div></div><div class="tag"></div></div>
    <div class="card"><div class="hd"><div class="ttl"></div><div class="ver"></div></div><div class="body"><i></i><i></i></div><div class="stack"><span class="cnt">未使用</span></div><div class="meta"></div><div class="ft"><div class="k"></div></div><div class="tag"></div></div>
  </div>
</div>
</body></html>
